<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>永遠闇市 — プロトタイプ (Phase 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#d8d2c6; --dim:#8b8578; --bg0:#0a0d12; --bg1:#10151d;
    --blue:#7fd6e8; --orange:#f4a02a; --line:#2a313c; --panel:#141a23;
    --gold:#e8c272; --good:#7fe0a0; --bad:#e07f7f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; color:var(--ink);
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN',monospace;
    background:
      radial-gradient(900px 600px at 15% 8%, rgba(127,214,232,.10), transparent 60%),
      radial-gradient(800px 600px at 85% 92%, rgba(244,160,42,.10), transparent 60%),
      radial-gradient(600px 500px at 70% 20%, rgba(244,160,42,.06), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg0));
    image-rendering:pixelated; letter-spacing:.02em;
  }
  .orbs{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .orb{position:absolute; width:10px; height:10px; border-radius:1px; animation:flick 3.2s ease-in-out infinite;}
  .orb.b{background:var(--blue); box-shadow:0 0 10px 3px rgba(127,214,232,.7),0 0 26px 8px rgba(127,214,232,.25);}
  .orb.o{background:var(--orange); box-shadow:0 0 10px 3px rgba(244,160,42,.7),0 0 26px 8px rgba(244,160,42,.25);}
  @keyframes flick{0%,100%{opacity:.35;} 45%{opacity:.95;} 60%{opacity:.55;}}
  @media (prefers-reduced-motion: reduce){ .orb{animation:none;} }

  .wrap{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:14px 14px 60px;}
  .title-em{font-size:30px; font-weight:700; letter-spacing:.1em; text-shadow:0 0 18px rgba(244,160,42,.35);}
  .sub{color:var(--dim); font-size:12px;}
  .note{color:var(--dim); font-size:11px; line-height:1.7;}
  a{color:var(--blue);}
  .center{text-align:center;} .big{font-size:22px;}

  .btn{font-family:inherit; cursor:pointer; color:var(--ink); background:#0e141c; border:2px solid var(--line); padding:8px 16px; font-size:13px; transition:.12s ease-out;}
  .btn:hover:not(:disabled){border-color:var(--orange); box-shadow:0 0 14px rgba(244,160,42,.35);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn.primary{border-color:var(--orange); color:#ffe8c8; background:#1a130a;}
  .btn.primary:hover{box-shadow:0 0 18px rgba(244,160,42,.55);}
  .btn.ghost{border-color:#3a424f; color:var(--dim);}
  .btn.sm{padding:4px 10px; font-size:12px;}

  .tag{display:inline-block; font-size:11px; padding:0 7px; border:2px solid var(--line); background:#0d1219;}
  .tag.C{color:var(--dim);} .tag.UC{color:var(--blue); border-color:rgba(127,214,232,.5);}
  .tag.R{color:var(--orange); border-color:rgba(244,160,42,.6); box-shadow:0 0 10px rgba(244,160,42,.3) inset;}
  .pill{display:inline-block; border:2px solid var(--line); padding:0 8px; font-size:11px; margin-left:6px;}
  .coin{color:var(--gold); text-shadow:0 0 10px rgba(232,194,114,.45);}
  .panel{background:var(--panel); border:2px solid var(--line); padding:14px;}

  /* ---- TCG ボード ---- */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .board{display:flex; flex-direction:column; gap:8px;}
  .zone{border:2px solid var(--line); padding:6px 10px; background:rgba(16,21,29,.55); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .zone.opp{border-color:rgba(127,214,232,.30);}
  .zone.me{border-color:rgba(244,160,42,.40);}
  .zone.active{box-shadow:0 0 16px rgba(244,160,42,.30); border-color:var(--orange);}
  .pname{font-size:14px;} .pname .turn{color:var(--orange);}
  .market{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media(max-width:780px){ .market{grid-template-columns:repeat(2,1fr);} }
  .mcard{border:2px solid var(--line); background:#0f1620; padding:7px; display:flex; flex-direction:column; gap:5px; position:relative;}
  .mcard.UC{border-color:rgba(127,214,232,.35); box-shadow:0 0 12px rgba(127,214,232,.10);}
  .mcard.R{border-color:rgba(244,160,42,.45); box-shadow:0 0 16px rgba(244,160,42,.16);}
  .mcard .no{position:absolute; top:5px; right:7px; color:var(--dim); font-size:10px;}
  .cmid{padding:2px 0;}
  .cmid .nm{font-size:13px; margin-top:2px;}
  .creq{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
  .cchip{border:1px solid #2a313c; background:#0c1118; padding:1px 5px; cursor:help; display:inline-flex; align-items:center; gap:3px; font-size:15px; line-height:1.5;}
  .cchip .dots{display:inline-flex; gap:1px;}
  .dot{font-size:9px;} .dot.y{color:var(--good);} .dot.n{color:#3a424f;}

  .ppin{border:2px solid #232a34; background:#0c1118; padding:4px 6px; min-height:40px;}
  .ppin.opp{border-color:rgba(127,214,232,.30);}
  .ppin.me{border-color:rgba(244,160,42,.45);}
  .ppin.lead{box-shadow:0 0 10px rgba(127,224,160,.40); border-color:var(--good);}
  .ppin.click{cursor:pointer;} .ppin.click:hover{box-shadow:0 0 12px rgba(244,160,42,.5);}
  .ppin.selA{border-color:var(--orange); box-shadow:0 0 14px rgba(244,160,42,.6); background:#1a130a;}
  .ppin .ttl{font-size:12px; color:var(--gold);} .ppin.opp .ttl{color:var(--blue);}
  .ppin .cnt{float:right; color:var(--ink); font-size:11px;}
  .icons{font-size:15px; line-height:1.7; margin-top:2px;}
  .ic{cursor:help;} .ic.off{opacity:.28; filter:grayscale(1);}
  .side{font-size:10px; color:var(--dim);}
  .winglow{box-shadow:0 0 18px rgba(127,224,160,.45); border-color:var(--good)!important;}
  .facedown{display:flex; align-items:center; justify-content:center; min-height:38px; color:var(--dim); border:2px dashed #2c3340; background:#0c1118; font-size:16px;}

  /* 仕込みの陳列スロット */
  .dempty{display:flex; align-items:center; justify-content:center; min-height:52px; border:2px dashed #2c3340; cursor:pointer; color:var(--dim); font-size:12px;}
  .dempty:hover{border-color:var(--blue);}
  .pins{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:8px; margin-top:8px;}
  .pin{border:2px solid var(--line); background:#0f1620; padding:6px 8px; cursor:pointer;}
  .pin:hover{border-color:var(--blue);}
  .pin.sel{border-color:var(--orange); box-shadow:0 0 12px rgba(244,160,42,.5); background:#1a130a;}
  .pin .ttl{font-size:12px;}

  /* ツールチップ */
  .tip{position:fixed; z-index:60; background:#0b0f15; border:2px solid var(--orange); color:var(--ink); font-size:12px; padding:5px 9px; max-width:260px; pointer-events:none; box-shadow:0 0 16px rgba(0,0,0,.7); display:none;}
  /* 凡例 */
  .legend{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px;}
  .legend .box{background:var(--panel); border:2px solid var(--orange); padding:18px; max-width:600px; max-height:84vh; overflow:auto;}
  .legend table{border-collapse:collapse; width:100%; font-size:13px;}
  .legend td{border-top:1px solid #20262f; padding:5px 6px; vertical-align:top;}
  .legend td:first-child{color:var(--dim); white-space:nowrap;}
  .glyph{font-size:17px;}

  .scorebar{display:flex; gap:14px; font-size:13px;}
  .testrow{font-size:12px; padding:2px 0; border-bottom:1px solid #1b212a;}
  .ok{color:var(--good);} .ng{color:var(--bad);}
</style>
</head>
<body>
<div class="orbs">
  <div class="orb b" style="left:8%;top:16%"></div>
  <div class="orb o" style="left:24%;top:60%;animation-delay:.6s"></div>
  <div class="orb b" style="left:46%;top:10%;animation-delay:1.1s"></div>
  <div class="orb o" style="left:76%;top:26%;animation-delay:.3s"></div>
  <div class="orb b" style="left:90%;top:72%;animation-delay:1.6s"></div>
  <div class="orb o" style="left:60%;top:86%;animation-delay:.9s"></div>
</div>
<div class="wrap"><div id="app"></div></div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.EM_DATA;
  const app = () => document.getElementById('app');
  if(!D){ document.getElementById('app').innerHTML = '<div class="panel">data.js が読み込めませんでした。index.html と同じ場所に data.js があるか確認してください。</div>'; return; }
  const CFG = D.CONFIG;
  const NPINS = CFG.pinsPerTurn;
  const ADJ_MAX = 2;

  /* ---------- 乱数 ---------- */
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function shuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ---------- 判定エンジン（純粋関数） ---------- */
  function satisfies(pin,c){ const v=pin[c.axis];
    switch(c.op){ case '==':return v===c.value; case '!=':return v!==c.value; case '>=':return v>=c.value; case '<=':return v<=c.value; default:return false; } }
  function countSatisfied(pin,cust){ if(!pin) return 0; return cust.conditions.reduce((n,c)=>n+(satisfies(pin,c)?1:0),0); }
  function judgeCustomer(pin0,pin1,cust,cfg){
    const n0=countSatisfied(pin0,cust), n1=countSatisfied(pin1,cust); let winner;
    if(n0===n1){ winner = cfg.tiebreak==='both'?'both' : cfg.tiebreak==='split'?'split' : null; }
    else winner = n0>n1?0:1;
    return {winner,n0,n1};
  }

  /* ---------- データ検証 ---------- */
  const MOTIFS=['animal','plant','person','food','object','nature','heraldry','vehicle','building'];
  const TRANSP=['transparent','translucent','opaque'], COUNTS=['single','multiple'], SHAPES=['circle','angular','irregular'];
  const RC={C:3,UC:4,R:5};
  function validateData(D){
    const e=[];
    if(!Array.isArray(D.PIN_POOL)||!D.PIN_POOL.length) e.push('PIN_POOL が空です');
    (D.PIN_POOL||[]).forEach(p=>{
      if(typeof p.size_mm!=='number') e.push('ピン '+(p.id||'?')+': size_mm が数字ではありません');
      if(!TRANSP.includes(p.transparency)) e.push('ピン '+p.id+': transparency が不正 ('+p.transparency+')');
      if(typeof p.hasText!=='boolean') e.push('ピン '+p.id+': hasText は true/false で書いてください');
      if(!COUNTS.includes(p.count)) e.push('ピン '+p.id+': count が不正 ('+p.count+')');
      if(typeof p.living!=='boolean') e.push('ピン '+p.id+': living は true/false で書いてください');
      if(!MOTIFS.includes(p.motif)) e.push('ピン '+p.id+': motif が不正 ('+p.motif+')');
      if(!SHAPES.includes(p.shape)) e.push('ピン '+p.id+': shape が不正 ('+p.shape+')');
      if(typeof p.symmetry!=='boolean') e.push('ピン '+p.id+': symmetry は true/false で書いてください');
    });
    (D.CUSTOMER_POOL||[]).forEach(c=>{
      if(!RC[c.rarity]) e.push('客 '+c.id+': rarity が不正 ('+c.rarity+')');
      else if((c.conditions||[]).length!==RC[c.rarity]) e.push('客 '+c.id+': 条件数が '+RC[c.rarity]+' 個ではありません ('+(c.conditions||[]).length+'個)');
      if(typeof c.vp!=='number') e.push('客 '+c.id+': vp が数字ではありません');
      (c.conditions||[]).forEach((cd,i)=>{
        if(!['size_mm','transparency','hasText','count','living','motif','shape','symmetry'].includes(cd.axis)) e.push('客 '+c.id+' 条件'+(i+1)+': axis が不正 ('+cd.axis+')');
        if(!['==','!=','>=','<='].includes(cd.op)) e.push('客 '+c.id+' 条件'+(i+1)+': op が不正 ('+cd.op+')');
      });
    });
    return e;
  }

  /* ---------- ラベル＆アイコン ---------- */
  const MOTJA={animal:'動物',plant:'植物',person:'人',food:'食',object:'器物',nature:'自然',heraldry:'紋章',vehicle:'乗物',building:'建物'};
  const TRJA={transparent:'透明',translucent:'半透明',opaque:'不透明'};
  const SHJA={circle:'円形',angular:'角形',irregular:'不定形'};
  const ICON={
    transparency:{transparent:'💎',translucent:'🌫️',opaque:'⬛'},
    count:{single:'1️⃣',multiple:'🔢'},
    motif:{animal:'🐾',plant:'🌿',person:'🧑',food:'🍞',object:'📦',nature:'🌙',heraldry:'🛡️',vehicle:'⛵',building:'🏛️'},
    shape:{circle:'🔵',angular:'🔺',irregular:'✴️'},
  };
  const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const pname = i => state.players[i].name;
  function condText(c){
    switch(c.axis){
      case 'size_mm': return '大きさ '+c.value+'mm '+(c.op==='>='?'以上':c.op==='<='?'以下':c.op);
      case 'hasText': return c.value?'文字・記号あり':'文字・記号なし';
      case 'living': return c.value?'生物である':'無生物である';
      case 'symmetry': return c.value?'左右対称':'非対称';
      case 'count': return c.value==='multiple'?'複数（群れ）':'単体';
      case 'transparency': return c.op==='!='?'透明感が'+TRJA[c.value]+'以外':'透明感：'+TRJA[c.value];
      case 'motif': return c.op==='!='?'絵柄が'+MOTJA[c.value]+'以外':'絵柄：'+MOTJA[c.value];
      case 'shape': return c.op==='!='?'形が'+SHJA[c.value]+'以外':'形：'+SHJA[c.value];
      default: return c.axis;
    }
  }
  function condGlyph(c){
    switch(c.axis){
      case 'size_mm': return '📏'+(c.op==='>='?'≥':c.op==='<='?'≤':'')+c.value;
      case 'transparency': return ICON.transparency[c.value]+(c.op==='!='?'🚫':'');
      case 'count': return ICON.count[c.value];
      case 'motif': return ICON.motif[c.value]+(c.op==='!='?'🚫':'');
      case 'shape': return ICON.shape[c.value]+(c.op==='!='?'🚫':'');
      case 'hasText': return c.value?'🔠':'🔠🚫';
      case 'living': return c.value?'💚':'🔩';
      case 'symmetry': return c.value?'🦋':'🍃';
      default: return '?';
    }
  }
  function ic(tip,glyph,off){ return '<span class="ic'+(off?' off':'')+'" data-tip="'+esc(tip)+'">'+glyph+'</span>'; }
  function pinIcons(p){ return [
    ic('大きさ '+p.size_mm+'mm','📏'+p.size_mm),
    ic('透明感：'+TRJA[p.transparency],ICON.transparency[p.transparency]),
    ic(p.hasText?'文字・記号あり':'文字・記号なし','🔠',!p.hasText),
    ic(p.count==='multiple'?'複数（群れ）':'単体',ICON.count[p.count]),
    ic(p.living?'生物':'無生物',p.living?'💚':'🔩'),
    ic('絵柄：'+MOTJA[p.motif],ICON.motif[p.motif]),
    ic('形：'+SHJA[p.shape],ICON.shape[p.shape]),
    ic(p.symmetry?'左右対称':'非対称',p.symmetry?'🦋':'🍃'),
  ].join(' '); }
  function pinChips(p){ return '大'+p.size_mm+' / '+TRJA[p.transparency]+' / 文字'+(p.hasText?'有':'無')+' / '+(p.count==='multiple'?'複数':'単体')+' / '+(p.living?'生物':'無生')+' / '+MOTJA[p.motif]+' / '+SHJA[p.shape]+' / '+(p.symmetry?'対称':'非対'); }

  /* ---------- 状態 ---------- */
  let state=null, sel=null, legendOpen=false;
  function instPins(ids){ const m={}; return ids.map(id=>{ const def=D.PIN_POOL.find(p=>p.id===id); m[id]=(m[id]||0)+1; return Object.assign({},def,{iid:id+'#'+m[id]}); }); }
  function instCustomers(ids){ const m={}; return ids.map(id=>{ const def=D.CUSTOMER_POOL.find(c=>c.id===id); m[id]=(m[id]||0)+1; return Object.assign({},def,{iid:id+'#'+m[id]}); }); }
  function newGame(){
    const rng=mulberry32(CFG.rngSeed);
    const mk=(pid,name)=>({ id:pid, name, coins:CFG.startingCoins,
      supply:instPins(D.PRESET_DECKS[pid].pins),
      customerDeck:shuffle(instCustomers(D.PRESET_DECKS[pid].customers),rng), acquired:[], stock:[] });
    state={ turn:0, phase:null, field:[], players:[mk('p0','プレイヤー1'),mk('p1','プレイヤー2')] };
    nextTurnStart();
  }
  function nextTurnStart(){
    state.turn++;
    if(state.turn>CFG.turns){ state.phase='gameover'; render(); return; }
    state.field=[]; state.stockStep=0; sel=null;
    state.players.forEach(p=>{ p.stock=new Array(NPINS).fill(null); });
    state.phase='stockHandoff'; render();
  }
  /* ----- 仕込み ----- */
  const stockP=()=>state.stockStep;
  function stockUsed(p){ return new Set(state.players[p].stock.filter(Boolean).map(x=>x.iid)); }
  function stockAvail(p){ const u=stockUsed(p); return state.players[p].supply.filter(pin=>!u.has(pin.iid)); }
  function beginStock(){ state.phase='stock'; sel=null; render(); }
  function selectStockPin(iid){ sel=(sel===iid?null:iid); render(); }
  function stockPlaceAt(i){ const p=stockP(); if(state.players[p].stock[i]||sel==null) return;
    const pin=state.players[p].supply.find(x=>x.iid===sel); if(!pin) return; state.players[p].stock[i]=pin; sel=null; render(); }
  function stockRemoveAt(i){ const p=stockP(); if(state.players[p].stock[i]){ state.players[p].stock[i]=null; render(); } }
  function stockReset(){ const p=stockP(); state.players[p].stock=new Array(NPINS).fill(null); sel=null; render(); }
  const stockReady=()=>state.players[stockP()].stock.every(Boolean);
  function stockConfirm(){ if(!stockReady()) return;
    if(state.stockStep===0){ state.stockStep=1; sel=null; state.phase='stockHandoff'; render(); } else revealAndAdjust(); }
  /* ----- 公開＋調整 ----- */
  function revealAndAdjust(){
    state.field=[];
    for(let p=0;p<2;p++) for(let k=0;k<CFG.customersPresentedPerPlayer;k++){ const c=state.players[p].customerDeck.shift(); if(c) state.field.push({customer:c,placed:[null,null],result:null}); }
    for(let i=0;i<state.field.length;i++) for(let p=0;p<2;p++) state.field[i].placed[p]=state.players[p].stock[i]||null;
    state.firstThisTurn=(state.turn-1)%2; state.adjustActive=state.firstThisTurn;
    state.changesLeft=[ADJ_MAX,ADJ_MAX]; state.passStreak=0; state.adjSel=null;
    state.phase='adjust'; render();
  }
  function selectAdjSlot(i){ const p=state.adjustActive; if(state.changesLeft[p]<=0) return;
    if(state.adjSel==null){ state.adjSel=i; render(); return; }
    if(state.adjSel===i){ state.adjSel=null; render(); return; }
    const a=state.adjSel,b=i,t=state.field[a].placed[p]; state.field[a].placed[p]=state.field[b].placed[p]; state.field[b].placed[p]=t;
    state.changesLeft[p]--; state.adjSel=null; state.passStreak=0; adjEndOrNext(); }
  function adjPass(){ state.adjSel=null; state.passStreak++; adjEndOrNext(); }
  function adjEndOrNext(){
    if(state.passStreak>=2 || (state.changesLeft[0]<=0 && state.changesLeft[1]<=0)){ doReveal(); return; }
    state.adjustActive=1-state.adjustActive; state.adjSel=null;
    if(state.changesLeft[state.adjustActive]<=0){ state.passStreak++; adjEndOrNext(); return; }
    render();
  }
  function doReveal(){
    state.field.forEach(f=>{ const r=judgeCustomer(f.placed[0],f.placed[1],f.customer,CFG); f.result=r;
      if(r.winner===0||r.winner===1){ const pl=state.players[r.winner]; pl.coins+=f.customer.vp; pl.acquired.push(f.customer); }
      else if(r.winner==='both'){ state.players[0].coins+=f.customer.vp; state.players[1].coins+=f.customer.vp; }
      else if(r.winner==='split'){ const h=Math.floor(f.customer.vp/2); state.players[0].coins+=h; state.players[1].coins+=h; } });
    state.phase='reveal'; render();
  }
  function nextTurn(){ for(let p=0;p<2;p++){ const used=new Set(state.field.map(f=>f.placed[p]).filter(Boolean).map(x=>x.iid)); state.players[p].supply=state.players[p].supply.filter(pin=>!used.has(pin.iid)); } nextTurnStart(); }
  function resetGame(){ if(confirm('最初からやり直しますか？ 現在の試合は破棄されます。')){ state=null; legendOpen=false; render(); } }

  /* ---------- 部品 ---------- */
  function legendBtn(){ return '<button class="btn ghost sm" onclick="EM.toggleLegend()">📖 凡例</button>'; }
  function legendModal(){
    return '<div class="legend" onclick="EM.toggleLegend()"><div class="box" onclick="event.stopPropagation()">'
      +'<div class="hdr" style="display:flex;justify-content:space-between"><div class="big">凡例（アイコンの意味）</div><button class="btn ghost sm" onclick="EM.toggleLegend()">閉じる ✕</button></div>'
      +'<table><tbody>'
      +'<tr><td>大きさ</td><td><span class="glyph">📏</span> ＋数字（mm）。条件は <b>≥</b>=以上 / <b>≤</b>=以下</td></tr>'
      +'<tr><td>透明感</td><td><span class="glyph">💎</span>透明 ／ <span class="glyph">🌫️</span>半透明 ／ <span class="glyph">⬛</span>不透明</td></tr>'
      +'<tr><td>文字・記号</td><td><span class="glyph">🔠</span>あり（薄い表示＝なし）</td></tr>'
      +'<tr><td>数</td><td><span class="glyph">1️⃣</span>単体 ／ <span class="glyph">🔢</span>複数（群れ）</td></tr>'
      +'<tr><td>生物性</td><td><span class="glyph">💚</span>生物 ／ <span class="glyph">🔩</span>無生物</td></tr>'
      +'<tr><td>絵柄</td><td><span class="glyph">🐾</span>動物 <span class="glyph">🌿</span>植物 <span class="glyph">🧑</span>人 <span class="glyph">🍞</span>食 <span class="glyph">📦</span>器物 <span class="glyph">🌙</span>自然 <span class="glyph">🛡️</span>紋章 <span class="glyph">⛵</span>乗物 <span class="glyph">🏛️</span>建物</td></tr>'
      +'<tr><td>形</td><td><span class="glyph">🔵</span>円形 ／ <span class="glyph">🔺</span>角形 ／ <span class="glyph">✴️</span>不定形</td></tr>'
      +'<tr><td>対称性</td><td><span class="glyph">🦋</span>左右対称 ／ <span class="glyph">🍃</span>非対称</td></tr>'
      +'<tr><td>その他</td><td><span class="glyph">🚫</span>付き＝「その値<b>以外</b>」 ／ <span class="coin">💰</span>＝客の点（獲得コイン）／ <span class="dot y">●</span><span class="dot n">●</span>＝左がP1・右がP2の達成</td></tr>'
      +'</tbody></table>'
      +'<div class="note" style="margin-top:10px">各アイコンはマウスを乗せると詳しい意味が出ます。</div>'
      +'</div></div>';
  }
  function ppinBox(pin,pi,i,lead,n){
    const clickable = state.phase==='adjust' && state.adjustActive===pi && state.changesLeft[pi]>0;
    const selA = clickable && state.adjSel===i ? ' selA':'';
    const cls='ppin '+(pi===0?'me':'opp')+(lead?' lead':'')+(clickable?' click':'')+selA;
    const onclick = clickable?(' onclick="EM.selectAdjSlot('+i+')"'):'';
    const tip = pin?('商品：'+pin.name+'｜'+pinChips(pin)):'空き';
    const head='<span class="cnt">満たした '+n+'</span><span class="ttl">'+(pin?'◇ '+esc(pin.name):'—')+'</span>';
    const body=pin?('<div class="icons">'+pinIcons(pin)+'</div>'):'';
    return '<div class="'+cls+'"'+onclick+' data-tip="'+esc(tip)+'"><div class="side">'+esc(pname(pi))+(state.adjustActive===pi&&state.phase==='adjust'?'（あなた）':'')+'</div>'+head+body+'</div>';
  }
  function condChip(c,p0,p1){
    const s0=p0&&satisfies(p0,c), s1=p1&&satisfies(p1,c);
    return '<span class="cchip" data-tip="'+esc(condText(c))+'">'+condGlyph(c)+'<span class="dots"><span class="dot '+(s0?'y':'n')+'">●</span><span class="dot '+(s1?'y':'n')+'">●</span></span></span>';
  }
  function custMid(c){ return '<div class="cmid"><span class="tag '+c.rarity+'">'+c.rarity+'</span> <span class="coin" data-tip="この客の点＝獲得コイン">💰'+c.vp+'</span><div class="nm">'+esc(c.name)+'</div></div>'; }

  /* ---------- 画面 ---------- */
  function titleScreen(){
    return '<div class="topbar"><div class="sub">EVER MARKET — PROTOTYPE</div>'+legendBtn()+'</div>'
      +'<div class="center" style="padding:30px 0">'
      +'<div class="title-em" style="margin:6px 0">永遠闇市</div>'
      +'<div class="sub" style="margin-bottom:24px">月の消える夜、決闘競売 — Phase&nbsp;1（コア）</div>'
      +'<button class="btn primary big" onclick="EM.startMatch()">2人で対戦をはじめる</button>'
      +'<div class="note" style="margin-top:24px; max-width:600px; display:inline-block; text-align:left">'
      +'・盤面は<b>TCG風</b>（上＝相手の陳列／中央＝客の卓／下＝自分）。<br>'
      +'・<b>仕込み</b>：客が見えない状態で商品（ピンズ）を4つ選び①〜④に並べる（伏せ・交代）。<br>'
      +'・<b>公開→調整</b>：客4枚が出て位置で対応。先行→後攻の順に自分のピン2つを入れ替え（各自2回・先行は毎ターン交代）。<br>'
      +'・条件/特性は<b>アイコン表示</b>。マウスを乗せると詳細、<b>📖凡例</b>で一覧。<br>'
      +'・<b>判定</b>：条件を多く満たした側が客を獲得＝<span class="coin">コイン</span>。同点は流れ。全'+CFG.turns+'ターン後コインが多い方が勝者。'
      +'</div>'
      +'<div class="note" style="margin-top:16px"><a href="?test">▶ セルフテストを実行</a></div></div>';
  }
  function topbar(label){ return '<div class="topbar"><div class="sub">ターン '+state.turn+' / '+CFG.turns+' ・ '+label+'</div>'+legendBtn()+'</div>'; }
  function zoneBar(pi,active,extra){
    return '<div class="zone '+(pi===0?'me':'opp')+(active?' active':'')+'"><div class="pname">'+(active?'<span class="turn">▶ </span>':'')+esc(pname(pi))+(active?' の番':'')+'</div><div class="scorebar"><span class="coin">🪙 '+state.players[pi].coins+'</span>'+(extra||'')+'</div></div>';
  }

  function stockHandoffScreen(){
    const nm=pname(state.stockStep);
    return topbar('仕込み')
      +'<div class="center" style="padding:46px 0">'
      +'<div class="big" style="margin:10px 0">'+esc(nm)+' の仕込み</div>'
      +'<div class="note" style="margin-bottom:22px">相手は画面を見ないでください。<br>商品（ピンズ）を4つ選んで①〜④に並べます。※まだ客は見えません（公開後に並べ替えで調整できます）。</div>'
      +'<button class="btn primary big" onclick="EM.beginStock()">仕込みをはじめる ▶</button></div>';
  }
  function stockScreen(){
    const p=stockP(); const avail=stockAvail(p);
    const head=topbar('仕込み — '+esc(pname(p))+' の陳列');
    const opp='<div class="zone opp"><div class="pname">'+esc(pname(1-p))+'</div><div class="note">仕込み中（伏せ）…</div></div>';
    const market='<div class="market">'+state.players[p].stock.map((pin,i)=>{
      const top='<div class="facedown" data-tip="客は公開後に分かります">❓ <span class="side" style="margin-left:6px">未公開の客</span></div>';
      const slot = pin
        ? '<div class="ppin me click" onclick="EM.stockRemoveAt('+i+')" data-tip="クリックで戻す"><span class="ttl">◇ '+esc(pin.name)+'</span><div class="icons">'+pinIcons(pin)+'</div></div>'
        : '<div class="dempty" onclick="EM.stockPlaceAt('+i+')">'+(sel!=null?'ここに置く ▼':'下のピンを選ぶ')+'</div>';
      return '<div class="mcard"><div class="no">陳列'+(i+1)+'</div>'+top+'<div class="cmid sub">↓ あなたの商品</div>'+slot+'</div>';
    }).join('')+'</div>';
    const placedN=state.players[p].stock.filter(Boolean).length;
    const me='<div class="zone me"><div class="pname">'+esc(pname(p))+'（あなた）</div><div class="scorebar"><span class="coin">🪙 '+state.players[p].coins+'</span><span class="note">陳列 '+placedN+'/'+NPINS+'</span></div></div>';
    const pins='<div class="panel" style="margin-top:8px"><div class="sub">あなたのピンズ（残り '+avail.length+' 個）— 選んで上の①〜④に置く</div>'
      +'<div class="pins">'+avail.map(pin=>'<div class="pin '+(sel===pin.iid?'sel':'')+'" onclick="EM.selectStockPin(\''+pin.iid+'\')"><div class="ttl">'+(sel===pin.iid?'◆ ':'')+esc(pin.name)+'</div><div class="icons">'+pinIcons(pin)+'</div></div>').join('')+'</div></div>';
    const bar='<div class="topbar" style="margin-top:12px"><div class="note">①〜④の順に4つ並べる（公開後に位置を入れ替え調整できる）</div><div style="display:flex;gap:8px">'
      +'<button class="btn ghost" onclick="EM.stockReset()">並べ直す</button>'
      +'<button class="btn ghost" onclick="EM.resetGame()">リセット</button>'
      +'<button class="btn primary" onclick="EM.stockConfirm()" '+(stockReady()?'':'disabled')+'>'+(state.stockStep===0?'確定して相手に渡す ▶':'確定して公開 ▶')+'</button></div></div>';
    return head+'<div class="board">'+opp+market+me+'</div>'+pins+bar;
  }

  function adjustScreen(){
    const act=state.adjustActive;
    const head=topbar('配置調整（公開）');
    const oppExtra='<span class="note">残り変更 '+state.changesLeft[1]+'</span>';
    const meExtra ='<span class="note">残り変更 '+state.changesLeft[0]+'</span>';
    const opp=zoneBar(1, act===1, oppExtra);
    const market='<div class="market">'+state.field.map((f,i)=>{
      const c=f.customer; const pre=judgeCustomer(f.placed[0],f.placed[1],c,CFG); const lead=[pre.winner===0,pre.winner===1];
      const reqs='<div class="creq">'+c.conditions.map(cd=>condChip(cd,f.placed[0],f.placed[1])).join('')+'</div>';
      const stat = (pre.winner===0||pre.winner===1)?('<div class="center" style="font-size:12px"><span class="coin">'+esc(pname(pre.winner))+' 優勢</span></div>'):'<div class="center note">互角＝流れ</div>';
      return '<div class="mcard '+c.rarity+'"><div class="no">客'+(i+1)+'</div>'
        + ppinBox(f.placed[1],1,i,lead[1],pre.n1)
        + custMid(c) + reqs + stat
        + ppinBox(f.placed[0],0,i,lead[0],pre.n0) + '</div>';
    }).join('')+'</div>';
    const me=zoneBar(0, act===0, meExtra);
    const guide='<div class="note" style="margin:6px 0">客カードの上＝'+esc(pname(1))+'のピン／下＝'+esc(pname(0))+'のピン。'
      +(state.changesLeft[act]>0?('<span class="coin">'+esc(pname(act))+'：自分の商品（'+(act===0?'下':'上')+'段）を2枚選ぶと位置を入れ替え（残り'+state.changesLeft[act]+'回）。'+(state.adjSel!=null?'1枚目選択中→もう1枚。':'')+'</span>'):'<span class="coin">'+esc(pname(act))+'：変更を使い切りました。パスしてください。</span>')+'</div>';
    const bar='<div class="topbar" style="margin-top:10px"><div class="note">両者が連続でパスすると判定に進みます</div><div style="display:flex;gap:8px">'
      +(state.adjSel!=null?'<button class="btn ghost" onclick="EM.cancelSel()">選択解除</button>':'')
      +'<button class="btn ghost" onclick="EM.resetGame()">リセット</button>'
      +'<button class="btn primary" onclick="EM.adjPass()">パス（相手の番へ） ▶</button></div></div>';
    return head+'<div class="board">'+opp+market+me+'</div>'+guide+bar;
  }

  function revealScreen(){
    const last=state.turn>=CFG.turns;
    const head=topbar('判定確定');
    const opp=zoneBar(1,false,'<span class="note">獲得 '+state.players[1].acquired.length+'</span>');
    const market='<div class="market">'+state.field.map((f,i)=>{
      const c=f.customer,r=f.result; const reqs='<div class="creq">'+c.conditions.map(cd=>condChip(cd,f.placed[0],f.placed[1])).join('')+'</div>';
      let verdict,cls='';
      if(r.winner===0||r.winner===1){ verdict='<span class="coin">'+esc(pname(r.winner))+' が獲得 (+'+c.vp+')</span>'; cls=' winglow'; }
      else if(r.winner==='both') verdict='<span class="coin">両者が獲得 (+'+c.vp+')</span>';
      else if(r.winner==='split') verdict='<span class="coin">折半 (+'+Math.floor(c.vp/2)+')</span>';
      else verdict='<span class="note">流れ（同点・誰も取れず）</span>';
      return '<div class="mcard '+c.rarity+cls+'"><div class="no">客'+(i+1)+'</div>'
        + ppinBox(f.placed[1],1,i,r.winner===1,r.n1) + custMid(c) + reqs
        + '<div class="center" style="font-size:12px">'+verdict+'</div>'
        + ppinBox(f.placed[0],0,i,r.winner===0,r.n0) + '</div>';
    }).join('')+'</div>';
    const me=zoneBar(0,false,'<span class="note">獲得 '+state.players[0].acquired.length+'</span>');
    const btn='<div class="center" style="margin-top:14px"><button class="btn primary big" onclick="EM.nextTurn()">'+(last?'最終結果へ ▶':'次のターンへ ▶')+'</button> <button class="btn ghost" onclick="EM.resetGame()">リセット</button></div>';
    return head+'<div class="board">'+opp+market+me+'</div>'+btn;
  }

  function gameOverScreen(){
    const c0=state.players[0].coins, c1=state.players[1].coins;
    const msg = c0>c1?pname(0)+' の勝利！' : c1>c0?pname(1)+' の勝利！' : '引き分け';
    const lines=state.players.map(p=>'<div style="margin:6px 0">'+esc(p.name)+'：<span class="coin big">🪙 '+p.coins+'</span>　<span class="note">（獲得客 '+p.acquired.length+' 人）</span></div>').join('');
    return '<div class="topbar"><div class="sub">EVER MARKET</div>'+legendBtn()+'</div>'
      +'<div class="center" style="padding:24px 0">'
      +'<div class="title-em" style="margin:8px 0 18px">'+esc(msg)+'</div>'
      +'<div class="panel" style="display:inline-block; text-align:left; min-width:300px">'+lines+'</div>'
      +'<div class="center" style="margin-top:20px"><button class="btn primary" onclick="EM.startMatch()">もう一度（同じ設定）</button> <button class="btn ghost" onclick="EM.toTitle()">タイトルへ</button></div>'
      +'<div class="note" style="margin-top:14px">※ Phase1はコインが貯まる＝得点のみ。コイン消費（遺物）の駆け引きはPhase2で追加。</div></div>';
  }

  function render(){
    let html;
    if(state===null) html=titleScreen();
    else switch(state.phase){
      case 'stockHandoff': html=stockHandoffScreen(); break;
      case 'stock':        html=stockScreen(); break;
      case 'adjust':       html=adjustScreen(); break;
      case 'reveal':       html=revealScreen(); break;
      case 'gameover':     html=gameOverScreen(); break;
      default: html=titleScreen();
    }
    app().innerHTML = html + (legendOpen?legendModal():'');
  }

  /* ---------- セルフテスト ---------- */
  function runTests(){
    const t=[]; const pinA={size_mm:30,transparency:'transparent',hasText:true,count:'multiple',living:true,motif:'animal',shape:'angular',symmetry:true};
    const pinB={size_mm:14,transparency:'opaque',hasText:false,count:'single',living:false,motif:'food',shape:'circle',symmetry:false};
    const cX={vp:1,conditions:[{axis:'size_mm',op:'>=',value:25},{axis:'motif',op:'==',value:'animal'},{axis:'living',op:'==',value:false}]};
    const add=(name,cond)=>t.push({name,pass:!!cond});
    add('satisfies >= 真', satisfies(pinA,{axis:'size_mm',op:'>=',value:25})===true);
    add('satisfies >= 偽', satisfies(pinB,{axis:'size_mm',op:'>=',value:25})===false);
    add('satisfies <= 真', satisfies(pinB,{axis:'size_mm',op:'<=',value:20})===true);
    add('satisfies == 列挙 真', satisfies(pinA,{axis:'motif',op:'==',value:'animal'})===true);
    add('satisfies != 真', satisfies(pinA,{axis:'transparency',op:'!=',value:'opaque'})===true);
    add('satisfies == 真偽 真', satisfies(pinA,{axis:'living',op:'==',value:true})===true);
    add('countSatisfied=2', countSatisfied(pinA,cX)===2);
    add('countSatisfied(null)=0', countSatisfied(null,cX)===0);
    add('judge 勝者0', judgeCustomer(pinA,pinB,cX,{tiebreak:'none'}).winner===0);
    add('judge 勝者1', judgeCustomer(pinB,pinA,cX,{tiebreak:'none'}).winner===1);
    const tie={vp:2,conditions:[{axis:'motif',op:'==',value:'object'}]};
    add('judge 同点 none→null', judgeCustomer(pinA,pinB,tie,{tiebreak:'none'}).winner===null);
    add('judge 同点 both', judgeCustomer(pinA,pinB,tie,{tiebreak:'both'}).winner==='both');
    add('judge 同点 split', judgeCustomer(pinA,pinB,tie,{tiebreak:'split'}).winner==='split');
    add('得点：勝者にvp加算', (function(){ let coins=0; const r=judgeCustomer(pinA,pinB,cX,{tiebreak:'none'}); if(r.winner===0) coins+=cX.vp; return coins===1; })());
    add('入れ替えで勝敗が変わる', (function(){ const cA={vp:1,conditions:[{axis:'motif',op:'==',value:'animal'}]}; return countSatisfied(pinB,cA)===0 && countSatisfied(pinA,cA)===1; })());
    add('全アイコン定義あり', MOTIFS.every(m=>ICON.motif[m]) && TRANSP.every(x=>ICON.transparency[x]) && SHAPES.every(x=>ICON.shape[x]));
    const errs=validateData(D);
    add('validateData：仮データにエラー0件'+(errs.length?'（'+errs.length+'件）':''), errs.length===0);
    return {t,errs};
  }
  function testScreen(){
    const {t,errs}=runTests(); const passed=t.filter(x=>x.pass).length;
    let html='<div class="topbar"><div><div class="sub">EVER MARKET — SELF TEST</div><div class="big">セルフテスト</div></div><div class="big '+(passed===t.length?'ok':'ng')+'">'+passed+' / '+t.length+' 通過</div></div>';
    html+='<div class="panel">'+t.map(x=>'<div class="testrow"><span class="'+(x.pass?'ok':'ng')+'">'+(x.pass?'✓':'✗')+'</span> '+esc(x.name)+'</div>').join('')+'</div>';
    if(errs.length) html+='<div class="panel" style="margin-top:12px"><div class="ng">データ検証エラー：</div>'+errs.map(e=>'<div class="testrow ng">'+esc(e)+'</div>').join('')+'</div>';
    html+='<div class="center" style="margin-top:18px"><a class="btn" href="./index.html">▶ ゲームへ戻る</a></div>';
    return html;
  }

  /* ---------- 公開API ---------- */
  window.EM={ startMatch:()=>{newGame();}, beginStock, selectStockPin, stockPlaceAt, stockRemoveAt, stockReset, stockConfirm,
    selectAdjSlot, adjPass, cancelSel:()=>{state.adjSel=null;render();}, nextTurn, resetGame, toTitle:()=>{state=null;legendOpen=false;render();},
    toggleLegend:()=>{legendOpen=!legendOpen;render();} };

  /* ---------- ツールチップ（マウスオーバー詳細） ---------- */
  const tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl);
  document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(el){ tipEl.textContent=el.getAttribute('data-tip'); tipEl.style.display='block'; } });
  document.addEventListener('mousemove', e=>{ if(tipEl.style.display==='block'){ let x=e.clientX+14, y=e.clientY+16; if(x>window.innerWidth-260) x=window.innerWidth-260; tipEl.style.left=x+'px'; tipEl.style.top=y+'px'; } });
  document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')) tipEl.style.display='none'; });

  /* ---------- 起動 ---------- */
  if(location.search.indexOf('test')>=0){ app().innerHTML=testScreen(); }
  else { const errs=validateData(D);
    if(errs.length){ app().innerHTML='<div class="panel"><div class="ng big">データにエラーがあります（'+errs.length+'件）</div><div class="note">data.js を修正してください：</div>'+errs.map(e=>'<div class="testrow ng">'+esc(e)+'</div>').join('')+'</div>'; }
    else render();
  }
})();
</script>
</body>
</html>
