<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>永遠闇市 — シミュレーター (Phase 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#d8d2c6; --dim:#8b8578; --bg0:#0a0d12; --bg1:#10151d;
    --blue:#7fd6e8; --orange:#f4a02a; --line:#2a313c; --panel:#141a23;
    --gold:#e8c272; --good:#7fe0a0; --bad:#e07f7f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; color:var(--ink);
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN',monospace;
    background:
      radial-gradient(900px 600px at 15% 8%, rgba(127,214,232,.10), transparent 60%),
      radial-gradient(800px 600px at 85% 92%, rgba(244,160,42,.10), transparent 60%),
      radial-gradient(600px 500px at 70% 20%, rgba(244,160,42,.06), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg0));
    image-rendering:pixelated; letter-spacing:.02em;
  }
  .orbs{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .orb{position:absolute; width:10px; height:10px; border-radius:1px; animation:flick 3.2s ease-in-out infinite;}
  .orb.b{background:var(--blue); box-shadow:0 0 10px 3px rgba(127,214,232,.7),0 0 26px 8px rgba(127,214,232,.25);}
  .orb.o{background:var(--orange); box-shadow:0 0 10px 3px rgba(244,160,42,.7),0 0 26px 8px rgba(244,160,42,.25);}
  @keyframes flick{0%,100%{opacity:.35;} 45%{opacity:.95;} 60%{opacity:.55;}}
  @media (prefers-reduced-motion: reduce){ .orb{animation:none;} }

  .wrap{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:14px 14px 60px;}
  .title-em{font-size:30px; font-weight:700; letter-spacing:.1em; text-shadow:0 0 18px rgba(244,160,42,.35);}
  .sub{color:var(--dim); font-size:12px;}
  .note{color:var(--dim); font-size:11px; line-height:1.7;}
  a{color:var(--blue);}
  .center{text-align:center;} .big{font-size:22px;}

  .btn{font-family:inherit; cursor:pointer; color:var(--ink); background:#0e141c; border:2px solid var(--line); padding:8px 16px; font-size:13px; transition:.12s ease-out;}
  .btn:hover:not(:disabled){border-color:var(--orange); box-shadow:0 0 14px rgba(244,160,42,.35);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn.primary{border-color:var(--orange); color:#ffe8c8; background:#1a130a;}
  .btn.primary:hover{box-shadow:0 0 18px rgba(244,160,42,.55);}
  .btn.ghost{border-color:#3a424f; color:var(--dim);}
  .btn.sm{padding:4px 10px; font-size:12px;}

  .tag{display:inline-block; font-size:11px; padding:0 7px; border:2px solid var(--line); background:#0d1219;}
  .tag.C{color:var(--dim);} .tag.UC{color:var(--blue); border-color:rgba(127,214,232,.5);}
  .tag.R{color:var(--orange); border-color:rgba(244,160,42,.6); box-shadow:0 0 10px rgba(244,160,42,.3) inset;}
  .pill{display:inline-block; border:2px solid var(--line); padding:0 8px; font-size:11px; margin-left:6px;}
  .coin{color:var(--gold); text-shadow:0 0 10px rgba(232,194,114,.45);}
  .panel{background:var(--panel); border:2px solid var(--line); padding:14px;}

  /* ---- 卓上ボード（夜の卓・革マット・布） ---- */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .board{display:flex; flex-direction:column; gap:10px; min-width:660px;}
  .table{border:6px solid #2c2114; border-radius:14px; padding:12px; overflow-x:auto; position:relative;
    background:
      radial-gradient(560px 340px at 50% 46%, rgba(244,160,42,.10), transparent 70%),
      radial-gradient(420px 240px at 14% 0%, rgba(127,214,232,.06), transparent 70%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, rgba(255,255,255,.014) 2px 60px),
      linear-gradient(180deg,#4a3826,#392b1b);
    box-shadow: inset 0 0 70px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.5);}
  .mat{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; border:2px solid #141a26;
    background:linear-gradient(180deg,#262c3d,#1b2130); box-shadow:0 4px 10px rgba(0,0,0,.45); flex-wrap:wrap;}
  .mat.me{border-color:#1a130a; background:linear-gradient(180deg,#33281a,#221a0f);}
  .mat.active{border-color:var(--orange); box-shadow:0 0 16px rgba(244,160,42,.35), 0 4px 10px rgba(0,0,0,.45);}
  .mat .mmid{flex:1; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; min-width:240px;}
  .mzone{border:1.5px dashed rgba(216,210,198,.20); color:rgba(216,210,198,.30); font-size:11px; letter-spacing:.2em;
    border-radius:6px; padding:10px 6px; min-width:56px; text-align:center; cursor:help;}
  .pname{font-size:14px;} .pname .turn{color:var(--orange);}
  .cpile{vertical-align:-3px; margin-right:3px;}
  .chiprow{display:inline-flex; gap:4px; align-items:center; margin-left:10px;}
  .chip{width:12px; height:12px; border-radius:50%; background:#cfc6b4; border:1px solid #968a70; box-shadow:0 1px 2px rgba(0,0,0,.4);}
  .chip.off{background:transparent; border:1px dashed #5a6172; box-shadow:none;}
  /* 競りの卓＝中央の布（clothband）＋紙の客カード（pcard）の段組み */
  .tgrid{display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)); column-gap:10px; row-gap:10px; position:relative; padding:2px;}
  .tgrid .lane{position:relative; z-index:1; display:flex; flex-direction:column; justify-content:stretch;}
  .clothband{grid-column:1/-1; grid-row:2; margin:-7px -9px; border-radius:6px; position:relative; z-index:0;
    background:linear-gradient(180deg,#5a2030,#451722); border:2px solid #36101a; box-shadow:inset 0 0 30px rgba(0,0,0,.55);}
  .clothband::after{content:''; position:absolute; inset:5px; border:1px dashed rgba(228,160,172,.22); border-radius:3px;}
  .pcard{position:relative; z-index:1; border-radius:6px; padding:7px 8px 8px; color:#3c3426;
    background:linear-gradient(180deg,#ece2c8,#ded2b2); border:1.5px solid #b3a685; box-shadow:0 4px 9px rgba(0,0,0,.5);}
  .pcard.r0{transform:rotate(-.9deg);} .pcard.r1{transform:rotate(.7deg);} .pcard.r2{transform:rotate(-.5deg);} .pcard.r3{transform:rotate(1deg);}
  .pcard.UC{border-color:#8aa6c0;}
  .pcard.R{border-color:#c69a2e; box-shadow:0 4px 9px rgba(0,0,0,.5), 0 0 12px rgba(232,194,114,.35);}
  .pcard .no{position:absolute; top:5px; right:7px; color:#8a7d5e; font-size:10px;}
  .pcard .nm{color:#2e2719;}
  .pcard .note{color:#7a6e54;}
  .pcard .coin{color:#8a6314; text-shadow:none;}
  .pcard .side{color:#8a7d5e;}
  .seal{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-size:11px; color:#f7efdc; vertical-align:middle;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.16), 0 1px 2px rgba(0,0,0,.35);}
  .seal.C{background:#a07a48;} .seal.UC{background:#5d86aa;}
  .seal.R{background:#c69a2e; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25), 0 0 8px rgba(232,194,114,.5);}
  .cvp{color:#7a5a10; margin-left:6px;}
  .cardback{position:relative; z-index:1; border-radius:6px; border:2px solid #161126; min-height:72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:repeating-linear-gradient(45deg,#241d33 0 9px,#2a2240 9px 18px); box-shadow:0 4px 9px rgba(0,0,0,.5);}
  .cardback .bk{font-size:18px; color:#8d80b5;}
  .cardback .side{color:#6f6590;}
  .cmid{padding:2px 0;}
  .cmid .nm{font-size:13px; margin-top:2px;}
  .creq{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
  .cchip{border:1px solid #c2b58f; background:#f0e7cd; padding:1px 5px; cursor:help; display:inline-flex; align-items:center; gap:3px; font-size:15px; line-height:1.5; border-radius:4px;}
  .cchip .dots{display:inline-flex; gap:1px;}
  .dot{font-size:9px;} .dot.y{color:#1f7a40;} .dot.n{color:#c4b794;}

  /* 商品＝トレイのくぼみ（recess）に置かれたトークン */
  .ppin{border:2px solid #11161f; background:linear-gradient(180deg,#1b2130,#151a25); border-radius:8px; padding:5px 7px; min-height:44px; box-shadow:inset 0 3px 9px rgba(0,0,0,.55);}
  .ppin.opp{border-color:#10141c;}
  .ppin.me{border-color:#160f07; background:linear-gradient(180deg,#231a0d,#1b1409);}
  .ppin.lead{box-shadow:0 0 10px rgba(127,224,160,.40), inset 0 3px 9px rgba(0,0,0,.45); border-color:var(--good);}
  .ppin.click{cursor:pointer;} .ppin.click:hover{box-shadow:0 0 12px rgba(244,160,42,.5), inset 0 3px 9px rgba(0,0,0,.45);}
  @keyframes tapwait{0%,100%{box-shadow:0 0 0 rgba(244,160,42,0), inset 0 3px 9px rgba(0,0,0,.45);} 50%{box-shadow:0 0 16px rgba(244,160,42,.75), inset 0 3px 9px rgba(0,0,0,.45);}}
  .ppin.await{cursor:pointer; border-color:var(--orange); animation:tapwait 1.25s ease-in-out infinite;}
  .pcard.await{cursor:pointer; outline:2px solid var(--orange); outline-offset:1px; animation:tapwait 1.25s ease-in-out infinite;}
  .ppin.selA{border-color:var(--orange); box-shadow:0 0 14px rgba(244,160,42,.6), inset 0 3px 9px rgba(0,0,0,.45); background:#1a130a;}
  .ppin .ttl{font-size:12px; color:var(--gold);} .ppin.opp .ttl{color:var(--blue);}
  .ppin .cnt{float:right; color:var(--ink); font-size:11px;}
  .icons{font-size:15px; line-height:1.9; margin-top:2px;}
  .ic{cursor:help; padding:0 1px;} .ic.off{opacity:.28; filter:grayscale(1);}
  .ic.hit{background:rgba(127,224,160,.22); outline:1px solid var(--good); border-radius:3px;}
  .ic.miss{background:rgba(224,127,127,.16); outline:1px solid rgba(224,127,127,.5); border-radius:3px;}
  .chk{font-size:12px; font-weight:700; margin:0 1px;} .chk.y{color:#1f7a40;} .chk.n{color:#b3372e;}
  .cnt.win{color:var(--good);}
  .prev{font-size:11px; text-align:center; margin-top:4px; border:1px dashed #b3a685; padding:1px 2px; color:#46689a;}
  .prev.best{color:#0a0d12; background:var(--good); border-color:var(--good); font-weight:700;}
  .prev.cur{color:#9a5b10; border-color:#c98a2a;}
  .tok{position:relative; display:inline-block; vertical-align:middle; line-height:0;}
  .tok svg{position:absolute; left:0; top:0; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));}
  .tok .motif{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.6); white-space:nowrap;}
  .tokwrap{display:flex; justify-content:center; padding:2px 0;}
  .pinrow2{display:flex; align-items:center; gap:8px;}
  .desire{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:4px; padding:3px; border:1px dashed #b9ac88; background:rgba(90,76,52,.06); border-radius:4px;}
  .tok.ghost{opacity:.95;}
  .side{font-size:10px; color:var(--dim);}
  .winglow{box-shadow:0 0 18px rgba(127,224,160,.45)!important; border-color:var(--good)!important;}

  /* 仕込みの陳列スロット（空きくぼみ） */
  .dempty{display:flex; align-items:center; justify-content:center; min-height:52px; border:2px dashed #5a4a30; border-radius:8px; background:rgba(0,0,0,.22); cursor:pointer; color:#9a8f78; font-size:12px;}
  .dempty:hover{border-color:var(--orange); color:var(--orange);}
  /* アクセサリーケース（手持ちピンズ。ベルベット内装＋区画） */
  .case{margin-top:10px; border:3px solid #5a4a30; border-radius:12px; padding:10px 12px;
    background:linear-gradient(180deg,#241c12,#1a130b); box-shadow:inset 0 0 34px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4);}
  .case .chdr{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; color:var(--gold); font-size:12px;}
  .cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:9px;}
  .cslot{min-height:88px; border-radius:9px; border:1px solid #1a1322; padding:6px 4px 5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:radial-gradient(70% 60% at 50% 38%, #3a2d49, #281e35 78%); box-shadow:inset 0 4px 10px rgba(0,0,0,.6);}
  .cslot.click{cursor:pointer;} .cslot.click:hover{border-color:var(--blue);}
  .cslot.sel{border:2px solid var(--orange); box-shadow:0 0 14px rgba(244,160,42,.5), inset 0 4px 10px rgba(0,0,0,.5); transform:translateY(-3px);
    background:radial-gradient(70% 60% at 50% 38%, #4a3322, #2e2112 78%);}
  .cslot .ttl{font-size:11px; color:#cfc8bd; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cslot.empty .imprint{width:34px; height:34px; border-radius:50%; border:2px dashed rgba(216,210,198,.10); background:rgba(0,0,0,.18);}

  /* ツールチップ */
  .tip{position:fixed; z-index:60; background:#0b0f15; border:2px solid var(--orange); color:var(--ink); font-size:12px; padding:5px 9px; max-width:260px; pointer-events:none; box-shadow:0 0 16px rgba(0,0,0,.7); display:none;}
  /* 凡例 */
  .legend{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px;}
  .legend .box{background:var(--panel); border:2px solid var(--orange); padding:18px; max-width:600px; max-height:84vh; overflow:auto;}
  .legend table{border-collapse:collapse; width:100%; font-size:13px;}
  .legend td{border-top:1px solid #20262f; padding:5px 6px; vertical-align:top;}
  .legend td:first-child{color:var(--dim); white-space:nowrap;}
  .glyph{font-size:17px;}

  /* 判定時の演出（獲得グロー・+Nポップ・コイン増加） */
  @keyframes empop{0%{transform:scale(.2);opacity:0;} 60%{transform:scale(1.3);} 100%{transform:scale(1);opacity:1;}}
  .pop{display:inline-block; animation:empop .5s ease-out backwards;}
  @keyframes emglow{0%{box-shadow:0 0 0 rgba(127,224,160,0);} 100%{box-shadow:0 0 18px rgba(127,224,160,.45);}}
  .winglow.anim{animation:emglow .6s ease-out .1s backwards;}
  .gainfx{color:var(--gold); margin-left:5px; font-weight:700; text-shadow:0 0 10px rgba(232,194,114,.6);}
  @media (prefers-reduced-motion: reduce){ .pop,.winglow.anim{animation:none;} }

  .scorebar{display:flex; gap:14px; font-size:13px;}
  .testrow{font-size:12px; padding:2px 0; border-bottom:1px solid #1b212a;}
  .ok{color:var(--good);} .ng{color:var(--bad);}

  /* ---- 遺物の手札（紙カード＋金貨コスト） ---- */
  .rhand{margin-top:10px; border:2px solid var(--line); border-radius:10px; padding:9px 11px; background:rgba(20,26,35,.55);}
  .rh-label{display:block; color:var(--gold); font-size:12px; margin-bottom:7px;}
  .rrow{display:flex; gap:10px; flex-wrap:wrap;}
  .rcard{position:relative; width:212px; border-radius:8px; padding:9px 11px 11px; color:#3c3426;
    background:linear-gradient(180deg,#ece2c8,#ded2b2); border:1.5px solid #b3a685; box-shadow:0 4px 9px rgba(0,0,0,.5);}
  .rcard.disabled{filter:grayscale(.55) brightness(.93);}
  .rcard .rcost{position:absolute; top:8px; right:9px; width:26px; height:26px; border-radius:50%;
    background:#c9a14a; color:#3a2a08; display:flex; align-items:center; justify-content:center; font-size:14px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.3), 0 1px 3px rgba(0,0,0,.4);}
  .rcard .rnm{font-size:14px; color:#2e2719; padding-right:30px;}
  .rcard .rsys{font-size:11px; color:#7a6e54; letter-spacing:.06em; margin-top:1px;}
  .rcard .rtx{font-size:12px; color:#46402f; margin:5px 0 9px; min-height:34px; line-height:1.5;}
  .rcard .btn{width:100%;}
  .rcard.dim{filter:grayscale(.55) brightness(.9) opacity(.78);}                 /* 今は使えないタイミングの遺物（待機） */
  .rcard.usable{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(201,161,74,.6), 0 4px 9px rgba(0,0,0,.5);} /* 今使える＝発光 */
  .rcard .rnow{display:inline-block; font-size:10px; color:#3a2a08; background:var(--gold); border-radius:4px; padding:0 5px; margin-left:5px; vertical-align:middle;}
  /* フェーズ進行バー（上部・横向き・5フェーズ） */
  .pbar{display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin:8px 0 2px;}
  .pstep{font-size:11px; border-radius:7px; padding:3px 9px; border:1px solid transparent; white-space:nowrap;}
  .pstep.done{background:rgba(201,161,74,.08); border-color:#43412f; color:#9b8f6c;}
  .pstep.cur{background:linear-gradient(180deg,#e3c477,#c9a14a); border-color:#f0d999; color:#2a1f08; font-weight:500; box-shadow:0 0 12px rgba(201,161,74,.55);}
  .pstep.todo{border:1px dashed #39414f; color:#6b7382;}
  .pstep .pchk{color:var(--gold);}
  /* 主人公選択 */
  .hgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; padding:0 4px 28px;}
  .hcard{border:2px solid var(--line); border-radius:9px; padding:10px 12px; cursor:pointer; background:linear-gradient(180deg,#1a2030,#141a26); transition:.12s ease-out;}
  .hcard:hover{border-color:var(--orange); box-shadow:0 0 14px rgba(244,160,42,.35);}
  .hcard .hd{font-size:11px; color:var(--blue); letter-spacing:.16em;}
  .hcard .hn{font-size:15px; color:#cfe6f0; margin:2px 0 5px;}
  .hcard .hb{font-size:12px; color:var(--ink); line-height:1.6; min-height:46px;}
  .hcard .hf{font-size:10px; margin-top:6px; color:var(--good);}
  .hcard.soon{opacity:.62;} .hcard.soon .hf{color:var(--dim);}
  .psep{color:#4a525f; font-size:11px;}
</style>
</head>
<body>
<div class="orbs">
  <div class="orb b" style="left:8%;top:16%"></div>
  <div class="orb o" style="left:24%;top:60%;animation-delay:.6s"></div>
  <div class="orb b" style="left:46%;top:10%;animation-delay:1.1s"></div>
  <div class="orb o" style="left:76%;top:26%;animation-delay:.3s"></div>
  <div class="orb b" style="left:90%;top:72%;animation-delay:1.6s"></div>
  <div class="orb o" style="left:60%;top:86%;animation-delay:.9s"></div>
</div>
<div class="wrap"><div id="app"></div></div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.EM_DATA;
  const app = () => document.getElementById('app');
  if(!D){ document.getElementById('app').innerHTML = '<div class="panel">data.js が読み込めませんでした。index.html と同じ場所に data.js があるか確認してください。</div>'; return; }
  const CFG = D.CONFIG;
  const NPINS = CFG.pinsPerTurn;
  const ADJ_MAX = 2;

  /* ---------- 乱数 ---------- */
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function shuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ---------- 判定エンジン（純粋関数） ---------- */
  function satisfies(pin,c){ const v=pin[c.axis];
    switch(c.op){ case '==':return v===c.value; case '!=':return v!==c.value; case '>=':return v>=c.value; case '<=':return v<=c.value; default:return false; } }
  function countSatisfied(pin,cust){ if(!pin) return 0; return cust.conditions.reduce((n,c)=>n+(satisfies(pin,c)?1:0),0); }
  function judgeCustomer(pin0,pin1,cust,cfg,bonus0,bonus1){
    bonus0=bonus0||0; bonus1=bonus1||0;                    // 判定直前の遺物（盃=自分+1／呪印=相手-1／酒宴=全+1）の条件数補正
    if(!pin0 && !pin1) return {winner:null, n0:0, n1:0};   // 誰も商品を出していない客は帰る（補正でも復活させない）
    const n0=countSatisfied(pin0,cust)+bonus0, n1=countSatisfied(pin1,cust)+bonus1; let winner;
    if(n0===n1){ winner = cfg.tiebreak==='both'?'both' : cfg.tiebreak==='split'?'split' : null; }
    else winner = n0>n1?0:1;
    return {winner,n0,n1};
  }
  /* ---------- 遺物の効果（state を受け取り効果を適用） ---------- */
  function applyRelic(st, pi, r){
    switch(r.effect){
      case 'plusSwapSelf': st.changesLeft[pi] += 1; break;                                   // 砂の還流：自分の入替+1
      case 'minusSwapOpp': st.changesLeft[1-pi] = Math.max(0, st.changesLeft[1-pi] - 1); break; // 沈黙の錘：相手の入替-1
      case 'betWin': if(st.bet) st.bet[pi]=true; break;                                       // 運命の賽：このターンの「賭け」を宣言（精算は判定時 betPayoff）
    }
  }
  /* 運命の賽の精算：このターンに獲得した客数(won)に応じた追加コイン（2人以上で+3／1人以下は0＝掛け金は戻らない）。純粋関数でテスト可能。 */
  function betPayoff(won){ return won>=2 ? 3 : 0; }
  /* 判定直前の遺物：誰の達成数を幾つ動かすか（盃=自分+1／呪印=相手-1）。純粋関数でテスト可能。 */
  function relicJudgeDelta(effect, pi){
    if(effect==='plusJudgeSelf') return { p:pi,   d:+1 };   // 満ちる盃：自分のピン+1
    if(effect==='minusJudgeOpp') return { p:1-pi, d:-1 };   // 凋落の呪印：相手のピン-1
    return null;
  }

  /* ---------- データ検証 ---------- */
  const MOTIFS=['animal','plant','person','food','object','nature','heraldry','vehicle','building'];
  const TRANSP=['transparent','translucent','opaque'], COUNTS=['single','multiple'], SHAPES=['circle','angular','irregular'];
  const RC={C:3,UC:4,R:5};
  function validateData(D){
    const e=[];
    if(!Array.isArray(D.PIN_POOL)||!D.PIN_POOL.length) e.push('PIN_POOL が空です');
    (D.PIN_POOL||[]).forEach(p=>{
      if(typeof p.size_mm!=='number') e.push('ピン '+(p.id||'?')+': size_mm が数字ではありません');
      if(!TRANSP.includes(p.transparency)) e.push('ピン '+p.id+': transparency が不正 ('+p.transparency+')');
      if(typeof p.hasText!=='boolean') e.push('ピン '+p.id+': hasText は true/false で書いてください');
      if(!COUNTS.includes(p.count)) e.push('ピン '+p.id+': count が不正 ('+p.count+')');
      if(typeof p.living!=='boolean') e.push('ピン '+p.id+': living は true/false で書いてください');
      if(!MOTIFS.includes(p.motif)) e.push('ピン '+p.id+': motif が不正 ('+p.motif+')');
      if(!SHAPES.includes(p.shape)) e.push('ピン '+p.id+': shape が不正 ('+p.shape+')');
      if(typeof p.symmetry!=='boolean') e.push('ピン '+p.id+': symmetry は true/false で書いてください');
    });
    (D.CUSTOMER_POOL||[]).forEach(c=>{
      if(!RC[c.rarity]) e.push('客 '+c.id+': rarity が不正 ('+c.rarity+')');
      else if((c.conditions||[]).length!==RC[c.rarity]) e.push('客 '+c.id+': 条件数が '+RC[c.rarity]+' 個ではありません ('+(c.conditions||[]).length+'個)');
      if(typeof c.vp!=='number') e.push('客 '+c.id+': vp が数字ではありません');
      (c.conditions||[]).forEach((cd,i)=>{
        if(!['size_mm','transparency','hasText','count','living','motif','shape','symmetry'].includes(cd.axis)) e.push('客 '+c.id+' 条件'+(i+1)+': axis が不正 ('+cd.axis+')');
        if(!['==','!=','>=','<='].includes(cd.op)) e.push('客 '+c.id+' 条件'+(i+1)+': op が不正 ('+cd.op+')');
      });
    });
    (D.RELIC_POOL||[]).forEach(r=>{
      if(typeof r.cost!=='number') e.push('遺物 '+(r.id||'?')+': cost が数字ではありません');
      if(!r.effect) e.push('遺物 '+(r.id||'?')+': effect が未定義です');
      if(r.timing && !['adjust','postReveal','declare','cleanup'].includes(r.timing)) e.push('遺物 '+(r.id||'?')+': timing が不正 ('+r.timing+')');
      if(/Judge(Self|Opp)$|swapCustomers|removeCustomer/.test(r.effect||'') && !r.target) e.push('遺物 '+(r.id||'?')+': 対象指定が必要な効果に target がありません');
    });
    (D.HERO_POOL||[]).forEach(h=>{
      if(!h.id) e.push('主人公: id がありません');
      if(!h.desire||!h.name) e.push('主人公 '+(h.id||'?')+': desire/name がありません');
      if(!h.normal||!h.normal.kind||!h.normal.text) e.push('主人公 '+(h.id||'?')+': normal(kind/text) がありません');
    });
    return e;
  }

  /* ---------- ラベル＆アイコン ---------- */
  const MOTJA={animal:'動物',plant:'植物',person:'人',food:'食',object:'器物',nature:'自然',heraldry:'紋章',vehicle:'乗物',building:'建物'};

  function condText(c){

  function matchInfo(pin,cust){ const green=new Set(),red=new Set(); if(pin&&cust){ cust.conditions.forEach(cd=>{ if(satisfies(pin,cd)) green.add(cd.axis); else red.add(cd.axis); }); red.forEach(a=>{ if(green.has(a)) red.delete(a); }); } return {green,red}; }
  function axIc(tip,glyph,axis,info,off){ let cls='ic'+(off?' off':''); if(info){ if(info.green.has(axis)) cls+=' hit'; else if(info.red.has(axis)) cls+=' miss'; } return '<span class="'+cls+'" data-tip="'+esc(tip)+'">'+glyph+'</span>'; }
  function pinIcons(p,info){ return [

  function pinChips(p){ return '大'+p.size_mm+' / '+TRJA[p.transparency]+' / 文字'+(p.hasText?'有':'無')+' / '+(p.count==='multiple'?'複数':'単体')+' / '+(p.living?'生物':'無生')+' / '+MOTJA[p.motif]+' / '+SHJA[p.shape]+' / '+(p.symmetry?'対称':'非対'); }
  /* ピンを「8軸を見た目に埋め込んだ商品トークン」として描画（形=輪郭/大きさ=サイズ/透明感=透け/対称性=左右対称/絵柄=中央紋様/数=紋様の数/生物性=有機⇄金属/文字=刻印） */
  function seedFromId(id){ let h=2166136261; for(let i=0;i<id.length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  // 色相=絵柄カテゴリ／鮮やかさ・明度=生物性（生物=鮮やか・無生物=くすんだ金属調）
  const HUE={animal:30,plant:110,person:332,food:52,object:215,nature:188,heraldry:275,vehicle:150,building:16};
  function tokFill(m,l){ const h=HUE[m]!=null?HUE[m]:210; return 'hsl('+h+','+(l?42:18)+'%,'+(l?30:26)+'%)'; }
  function tokStroke(m,l){ const h=HUE[m]!=null?HUE[m]:210; return 'hsl('+h+','+(l?62:24)+'%,'+(l?66:60)+'%)'; }
  function pinTokenHTML(pin,px){ px=px||50; const cx=px/2,cy=px/2;
    const r=(0.22*px)+((Math.max(10,Math.min(52,pin.size_mm))-10)/42)*(0.24*px);
    const fill=tokFill(pin.motif,pin.living), stroke=tokStroke(pin.motif,pin.living);
    const op=pin.transparency==='transparent'?0.18:pin.transparency==='translucent'?0.55:0.95;
    let shape;
    if(pin.shape==='circle') shape='<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'"/>';
    else if(pin.shape==='angular'){ const p=[]; for(let k=0;k<6;k++){const a=Math.PI/6+k*Math.PI/3; p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));} shape='<polygon points="'+p.join(' ')+'"/>'; }
    else { const rng=mulberry32(seedFromId(pin.id)); const p=[],n=9; for(let k=0;k<n;k++){const a=k*2*Math.PI/n-Math.PI/2; const rr=r*(0.62+0.38*rng()); p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));} shape='<polygon points="'+p.join(' ')+'"/>'; }
    const sheen=pin.transparency!=='opaque'?'<line x1="'+(cx-r*0.5).toFixed(1)+'" y1="'+(cy-r*0.15).toFixed(1)+'" x2="'+(cx-r*0.05).toFixed(1)+'" y2="'+(cy-r*0.6).toFixed(1)+'" stroke="#fff" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>':'';
    const asym=!pin.symmetry?'<circle cx="'+(cx+r*0.7).toFixed(1)+'" cy="'+(cy-r*0.55).toFixed(1)+'" r="'+(px*0.055).toFixed(1)+'" fill="'+stroke+'"/>':'';
    const rune=pin.hasText?'<text x="'+cx+'" y="'+(px-3)+'" font-size="'+(px*0.18).toFixed(0)+'" text-anchor="middle" fill="'+stroke+'" opacity="0.9">✶</text>':'';
    const svg='<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'"><g fill="'+fill+'" fill-opacity="'+op+'" stroke="'+stroke+'" stroke-width="2" stroke-linejoin="round">'+shape+'</g>'+sheen+asym+rune+'</svg>';
    const g=ICON.motif[pin.motif];
    const mf=pin.count==='multiple'?'<span class="motif" style="font-size:'+(px*0.24).toFixed(0)+'px;letter-spacing:-2px">'+g+g+g+'</span>':'<span class="motif" style="font-size:'+(px*0.4).toFixed(0)+'px">'+g+'</span>';
    return '<span class="tok" style="width:'+px+'px;height:'+px+'px" data-tip="'+esc('商品：'+pin.name+'｜'+pinChips(pin))+'">'+svg+mf+'</span>';
  }
  /* 客が「ほしい品」のイメージをゴーストトークンで表示（形/透明感/絵柄/数を薄く描画。正確な条件は下の✓印） */
  function desireTokenHTML(c,px){ px=px||46; const cx=px/2,cy=px/2,r=0.33*px;
    const m={}; c.conditions.forEach(cd=>{ if(!m[cd.axis]) m[cd.axis]=cd; });
    const sh=m.shape, shp=(sh&&sh.op==='==')?sh.value:null; let outline, dash='';
    if(shp==='circle') outline='<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'"/>';

    else if(shp==='irregular'){ const rng=mulberry32(seedFromId(c.id)); const p=[],n=9; for(let k=0;k<n;k++){const a=k*2*Math.PI/n-Math.PI/2;const rr=r*(0.62+0.38*rng());p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));} outline='<polygon points="'+p.join(' ')+'"/>'; }

  }

  /* ---------- 状態 ---------- */

  /* ----- テスト記録（localStorageに自動蓄積・統計） ----- */
  const RKEY='em_results_v1';

  function recordResult(){ try{ const p=state.players; const tal=pl=>{const t={C:0,UC:0,R:0};pl.acquired.forEach(c=>t[c.rarity]++);return t;};

  function resultsTSV(){ const a=loadResults(); let s='日時\tシード\t同点\t先行\tデッキ\t種銭\t強制線\tターン数\tP1コイン\tP2コイン\t勝者\tコイン差\t流れ数\t強制勝利\t終了T\tP1獲得C/UC/R\tP2獲得C/UC/R\n';

  /* 条件別の平均（同点/先行/デッキ/種銭/強制線でグループ化） */
  function condStatsHTML(a){

    const keys=Object.keys(g).sort((x,y)=>g[y].length-g[x].length).slice(0,8);
    if(!keys.length) return '';
    let h='<div class="sub" style="margin-top:14px">条件別の平均（試合数の多い順・最大8条件）</div><table><tbody><tr><td>設定</td><td>試合</td><td>P1/P2/分</td><td>平均コイン</td><td>平均差</td><td>流れ/試合</td><td>⚡強制勝利</td></tr>';
    keys.forEach(k=>{ const rs=g[k], n=rs.length;
      const w0=rs.filter(r=>r.w===0).length, w1=rs.filter(r=>r.w===1).length, dr=n-w0-w1;

  /* ----- 主人公の選択（試合開始時・公開）。AIはランダム／ミラーは両者同一（ユーザー決定 2026-06-23）----- */

  function aiBestSwap(p){ const base=aiWonVP(p); let best=null,bg=0,F=state.field; for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){ const t=F[i].placed[p];F[i].placed[p]=F[j].placed[p];F[j].placed[p]=t; const g=aiWonVP(p)-base; const u=F[i].placed[p];F[i].placed[p]=F[j].placed[p];F[j].placed[p]=u; if(g>bg){bg=g;best={i,j};} } return best; }

  function aiTakeTurn(){ state.adjHistory.push(adjSnapshot(1,'ai')); const P=state.players[1];

    if(aiHasRelic(1,'rel_omori') && P.coins>=1 && state.changesLeft[0]>0 && aiBestSwap(0)){ aiApplyRelic(1,'rel_omori'); state.passStreak=0; return; } // 沈黙の錘：自分に有益な入替が無く、相手は得しそう→妨害（c1・手番非消費）

  // ※片付けの導きの羅針はAI未使用（情報のみで、AIの仕込み aiStock は先読みを使わないため利得が無い）。楔も相手の伏せを読めず評価不能のため未使用。

  /* ----- 公開＋調整 ----- */
  function revealAndAdjust(){
    state.field=[];
    for(let p=0;p<2;p++) for(let k=0;k<CFG.customersPresentedPerPlayer;k++){ const c=state.players[p].customerDeck.shift(); if(c) state.field.push({customer:c,placed:[null,null],result:null}); }
    for(let i=0;i<state.field.length;i++) for(let p=0;p<2;p++) state.field[i].placed[p]=state.players[p].stock[i]||null;
    let first; const c0=state.players[0].coins,c1=state.players[1].coins;
    if(S.firstMover==='fixed') first=0;
    else if(S.firstMover==='trailing') first=(c0<c1?0:(c1<c0?1:(state.turn-1)%2));
    else first=(state.turn-1)%2;
    { const s0=heroNormal(0,'chooseSecond'), s1=heroNormal(1,'chooseSecond'); if(s0&&!s1) first=1; else if(s1&&!s0) first=0; }   // 睡眠：常に後攻を選ぶ（相手が先行・両者睡眠は通常）
    state.firstThisTurn=first; state.adjustActive=first;

    state.judgeDelta=null; state.declarations=[null,null]; state.declLog=[]; state.declSel=null; state.declaredThisTurn=[false,false]; // 遺物の宣言（毎ターン初期化）
    state.bet=[false,false]; state.betWon=[0,0];   // 運命の賽：このターンの賭け宣言と獲得人数（毎ターン初期化）
    state.heroTurn=[{},{}];                          // 主人公パッシブのターン上限カウンタ（毎ターン初期化）
    beginDeclareWindow('postReveal');   // 公開直後の遺物（誘いの香 等）→ 使える遺物が無ければ即 startAdjust()
  }
  function startAdjust(){ state.phase='adjust'; adjKickoff(); }
  /* ----- 1手戻す（調整フェーズ限定のアンドゥ） ----- */
  function adjSnapshot(by,kind){ return { by, kind, placed:state.field.map(f=>f.placed.slice()), changesLeft:state.changesLeft.slice(), passStreak:state.passStreak, active:state.adjustActive }; }
  function canUndoAdj(){ const h=state.adjHistory; if(!h||!h.length) return false; return state.mode==='ai' ? h.some(x=>x.by===0) : true; }

    const k=P.relicHand.indexOf(rid); if(k<0) return;                 // 手札に無い

    while(true){
      if(adjEnded()){ beginDeclareWindow('declare'); return; }   // 調整終了→判定直前の宣言（使える遺物が無ければ即判定）
      state.adjustActive = 1-state.adjustActive; state.adjSel=null;
      const a=state.adjustActive;
      if(state.changesLeft[a]<=0){ state.passStreak++; continue; }       // 変更切れ→自動パス、再度交代
      if(state.mode==='ai' && a===1){ aiTakeTurn(); continue; }          // AIが打つ→ループで人間へ交代
      render(); return;                                                  // 人間の番
    }
  }
  function adjKickoff(){ // 調整開始時：先行がAIなら打たせる／人間なら描画して待つ
    const a=state.adjustActive;
    if(state.changesLeft[a]<=0){ adjAfterMove(); return; }
    if(state.mode==='ai' && a===1){ aiTakeTurn(); adjAfterMove(); return; }
    render();
  }
  /* ----- 遺物の同時伏せ宣言ウィンドウ（公開直後 / 判定直前）＝同時伏せ → 先行側から解決（正本 2026-06-12）。各窓は1人1枚＝PD-01（保留） ----- */
  function canDeclare(pi, timing){
    if(S.relicLimit==='perTurn' && state.declaredThisTurn && state.declaredThisTurn[pi]) return false;   // 1ターン1枚：既に今ターン使用済み（PD-01）
    return (state.players[pi].relicHand||[]).some(rid=>{ const r=relicDef(rid); return r && r.timing===timing && state.players[pi].coins>=heroCost(pi,r); });
  }
  function beginDeclareWindow(timing){
    state.declTiming=timing;
    const anyone = canDeclare(0,timing) || canDeclare(1,timing);
    if(S.declareWindow!=='always' && !anyone){ continueAfterWindow(); return; }            // 「使える時だけ」かつ誰も使えない→窓を出さない（PD-02：既定は'always'で常に表示）
    if(timing==='declare') state.judgeDelta=state.field.map(()=>[0,0]);                    // 判定補正の受け皿（判定直前のみ）
    state.declarations=[null,null]; state.declSel=null;
    state.declOrder=[state.firstThisTurn, 1-state.firstThisTurn];                          // 解決は先行→後攻（伏せは同時・相手の宣言は見えない）
    state.declStep=0; declAdvance();
  }
  function continueAfterWindow(){ if(state.declTiming==='postReveal') startAdjust(); else doReveal(); }  // 公開直後→調整／判定直前→判定
  function declAdvance(){
    while(state.declStep<2){
      const pi=state.declOrder[state.declStep], canAct=canDeclare(pi, state.declTiming);
      if(state.mode==='ai' && pi===1){ state.declarations[pi]= canAct ? aiDeclare(1, state.declTiming) : null; state.declStep++; continue; } // AIは自動（空窓は見せない）
      if(!canAct && S.declareWindow!=='always'){ state.declarations[pi]=null; state.declStep++; continue; }  // 「使える時だけ」：使えなければ自動パス
      state.declSel=null;
      state.phase = (state.mode==='ai') ? 'declare' : 'declareHandoff';                    // 'always'では使えなくても窓を表示（手札なしと分かる）
      render(); return;
    }
    resolveDeclarations();
  }
  function resolveDeclarations(){
    const order=[state.firstThisTurn, 1-state.firstThisTurn];       // 先行側から解決（公開直後はスロット位置で順次適用＝PD-03）
    order.forEach(pi=>{
      const d=state.declarations[pi]; if(!d) return;
      const r=relicDef(d.relic); if(!r) return; const cost=heroCost(pi,r); if(state.players[pi].coins < cost) return;
      state.players[pi].coins -= cost;                              // 支払い（無欲はコスト−1）＝最終得点が減る（単一プール）
      const k=state.players[pi].relicHand.indexOf(d.relic); if(k>=0) state.players[pi].relicHand.splice(k,1);
      if(state.declaredThisTurn) state.declaredThisTurn[pi]=true;   // 「1ターン1枚」設定の判定用（PD-01）
      applyDeclaredRelic(state, pi, d, r);                          // 効果を盤面/判定補正へ反映
      state.declLog.push({ pi, name:r.name, slot:d.slot, slot2:d.slot2, effect:r.effect, timing:r.timing });
    });
    continueAfterWindow();
  }
  /* 宣言遺物の効果適用（st を受け取り反映）。判定補正は judgeDelta、客入替/除外は field を操作（テスト可能）。 */
  function applyDeclaredRelic(st, pi, d, r){
    switch(r.effect){
      case 'plusJudgeSelf': case 'minusJudgeOpp': { const jd=relicJudgeDelta(r.effect, pi); if(jd && st.judgeDelta && st.judgeDelta[d.slot] && !(jd.d<0 && heroHasKind(st,jd.p,'immuneToMinus'))) st.judgeDelta[d.slot][jd.p]+=jd.d; break; }   // 不朽：−1系は不朽のピンに効かない
      case 'plusJudgeAllSelf': { if(st.judgeDelta) for(let i=0;i<st.judgeDelta.length;i++) st.judgeDelta[i][pi]+=1; break; }   // 黄金の酒宴：自分の全ピン+1
      case 'swapCustomers': { const a=d.slot, b=d.slot2; if(st.field[a] && st.field[b] && !st.field[a].locked && !st.field[b].locked){ const t=st.field[a].customer; st.field[a].customer=st.field[b].customer; st.field[b].customer=t; } break; }   // 不動の楔(locked)で防がれる
      case 'removeCustomer': { if(st.field[d.slot] && !st.field[d.slot].locked) st.field[d.slot].removed=true; break; }   // 忘却の髑髏：客を除外＝流れ（楔で防がれる・ヤルナR6と同型）
      case 'lockCustomer': { if(st.field[d.slot]) st.field[d.slot].locked=true; break; }   // 不動の楔：移動も除外もされない（香炉/忘却のカウンター）
      case 'maskMotifSelf': { const f=st.field[d.slot]; if(f && st.judgeDelta && st.judgeDelta[d.slot]){ let add=0; (f.customer.conditions||[]).forEach(function(c){ if(c.axis==='motif' && !satisfies(f.placed[pi],c)) add++; }); st.judgeDelta[d.slot][pi]+=add; } break; }   // 偽相の仮面：絵柄を任意＝その客の絵柄条件を全て満たす扱い（条件数補正に換算）
    }
  }
  /* AI（ソロ用）：その窓で使える遺物を貪欲に1枚だけ評価。コイン換算で純利得が正なら伏せる（読み取り専用）。 */
  function aiPairVp(pi,opp,vpOf){ let s=0; state.field.forEach(f=>{ if(f.removed) return; const r=judgeCustomer(f.placed[0],f.placed[1],f.customer,S); s+=vpOf(r,pi,f.customer.vp)-vpOf(r,opp,f.customer.vp); }); return s; }
  function aiDeclare(pi, timing){
    const opp=1-pi; let best=null, bestGain=0;
    const vpOf=(res,who,vp)=> res.winner===who?vp : res.winner==='split'?Math.ceil(vp/2) : res.winner==='both'?vp : 0;
    (state.players[pi].relicHand||[]).forEach(rid=>{
      const r=relicDef(rid); if(!r || r.timing!==timing || state.players[pi].coins<heroCost(pi,r)) return;
      if(r.effect==='plusJudgeSelf' || r.effect==='minusJudgeOpp'){
        const jd=relicJudgeDelta(r.effect, pi); if(!jd) return;
        for(let i=0;i<state.field.length;i++){ const f=state.field[i], vp=f.customer.vp;
          const base=judgeCustomer(f.placed[0],f.placed[1],f.customer,S); const b=[0,0]; b[jd.p]=jd.d;
          const after=judgeCustomer(f.placed[0],f.placed[1],f.customer,S,b[0],b[1]);
          const gain=(vpOf(after,pi,vp)-vpOf(after,opp,vp))-(vpOf(base,pi,vp)-vpOf(base,opp,vp))-r.cost;
          if(gain>bestGain){ bestGain=gain; best={relic:r.id, slot:i}; } }
      } else if(r.effect==='swapCustomers'){
        const base=aiPairVp(pi,opp,vpOf);
        for(let a=0;a<state.field.length;a++) for(let b=a+1;b<state.field.length;b++){
          const t=state.field[a].customer; state.field[a].customer=state.field[b].customer; state.field[b].customer=t;
          const after=aiPairVp(pi,opp,vpOf);
          const u=state.field[a].customer; state.field[a].customer=state.field[b].customer; state.field[b].customer=u;  // 元に戻す
          const gain=(after-base)-r.cost;
          if(gain>bestGain){ bestGain=gain; best={relic:r.id, slot:a, slot2:b}; }
        }
      } else if(r.effect==='removeCustomer'){
        for(let i=0;i<state.field.length;i++){ if(state.field[i].removed) continue; const f=state.field[i], vp=f.customer.vp;
          const base=judgeCustomer(f.placed[0],f.placed[1],f.customer,S);
          const gain=(vpOf(base,opp,vp)-vpOf(base,pi,vp))-r.cost;   // 相手が取る客を流す＝相手の得を消す（自分が取る客なら損）
          if(gain>bestGain){ bestGain=gain; best={relic:r.id, slot:i}; } }
      } else if(r.effect==='plusJudgeAllSelf'){
        let tot=0;
        for(let i=0;i<state.field.length;i++){ if(state.field[i].removed) continue; const f=state.field[i], vp=f.customer.vp;
          const base=judgeCustomer(f.placed[0],f.placed[1],f.customer,S); const b=[0,0]; b[pi]=1;
          const after=judgeCustomer(f.placed[0],f.placed[1],f.customer,S,b[0],b[1]);
          tot += (vpOf(after,pi,vp)-vpOf(after,opp,vp))-(vpOf(base,pi,vp)-vpOf(base,opp,vp)); }
        const gain=tot-r.cost;
        if(gain>bestGain){ bestGain=gain; best={relic:r.id}; }   // 全ピン+1（対象スロットなし）
      } else if(r.effect==='maskMotifSelf'){
        for(let i=0;i<state.field.length;i++){ if(state.field[i].removed) continue; const f=state.field[i], vp=f.customer.vp;
          let add=0; (f.customer.conditions||[]).forEach(function(c){ if(c.axis==='motif' && !satisfies(f.placed[pi],c)) add++; }); if(add<=0) continue;
          const base=judgeCustomer(f.placed[0],f.placed[1],f.customer,S); const b=[0,0]; b[pi]=add;
          const after=judgeCustomer(f.placed[0],f.placed[1],f.customer,S,b[0],b[1]);
          const gain=(vpOf(after,pi,vp)-vpOf(after,opp,vp))-(vpOf(base,pi,vp)-vpOf(base,opp,vp))-r.cost;
          if(gain>bestGain){ bestGain=gain; best={relic:r.id, slot:i}; } }
      }
      // 不動の楔(lockCustomer)はAIの貪欲評価では利得を測れない（相手の宣言を見ないため）→AIは使わない
    });
    return bestGain>0 ? best : null;
  }
  function doReveal(){
    state.lastGain=[0,0]; state.coinAnimDone=false; // このターンの増分（判定画面の演出用）
    const won=[0,0];                                // このターンに各自が獲得した客の人数（運命の賽の精算用。折半/両取りも「獲得」に数える）
    const HT=state.heroTurn||(state.heroTurn=[{},{}]);   // 主人公パッシブのターン上限カウンタ
    const hg=(pi,n)=>{ state.players[pi].coins+=n; state.lastGain[pi]+=n; };   // 主人公のコイン加算（+N表示にも乗せる）
    state.field.forEach((f,idx)=>{ if(f.removed){ f.result={winner:null,n0:0,n1:0}; return; }  // 忘却で除外＝流れ（誰も獲得しない）
      const dz=(state.judgeDelta&&state.judgeDelta[idx])||[0,0];
      const r=judgeCustomer(f.placed[0],f.placed[1],f.customer,S,dz[0]+heroFreedomBonus(0,idx,f),dz[1]+heroFreedomBonus(1,idx,f)); f.result=r; // 盃/呪印の補正＋自由（陳列②の絵柄ワイルド）
      if(r.winner===0||r.winner===1){ const pl=state.players[r.winner]; pl.coins+=f.customer.vp; pl.acquired.push(f.customer); state.lastGain[r.winner]+=f.customer.vp; won[r.winner]++; heroAcquire(r.winner,f.customer,HT,hg); heroDominate(r.winner,r,HT,hg); heroSteal(r.winner,f.customer,HT,hg); }
      else if(r.winner==='both'||r.winner==='split'){ const v=(r.winner==='both')?f.customer.vp:Math.ceil(f.customer.vp/2); [0,1].forEach(p=>{ state.players[p].coins+=v; state.players[p].acquired.push(f.customer); state.lastGain[p]+=v; won[p]++; heroAcquire(p,f.customer,HT,hg); }); [0,1].forEach(p=>heroSteal(p,f.customer,HT,hg)); } });
    heroClaimFlows(won,hg);                          // 王権：流れた客（同点・忘却以外）の最初の1人を獲得（先行→後攻）
    const flowN=state.field.filter(f=>!f.removed && f.result && f.result.winner===null && f.claimed==null).length;   // 物欲用の「流れ」（王権が取った分・忘却分は除く）
    if(flowN>0){ heroFlow(0,flowN,HT,hg); heroFlow(1,flowN,HT,hg); }
    state.betWon=won;                               // 運命の賽の精算（掛け金は調整中に支払い済み。成功で+3）。PD-09：折半既定での「2人以上」の数え方は要検討
    state.players.forEach((pl,pi)=>{ if(state.bet&&state.bet[pi]){ const pay=betPayoff(won[pi]); if(pay>0){ pl.coins+=pay; state.lastGain[pi]+=pay; const yn=heroNormal(pi,'betRefundPlus'); if(yn){ const ref=(relicDef('rel_sai')?relicDef('rel_sai').cost:1)+(yn.n||1); pl.coins+=ref; state.lastGain[pi]+=ref; } } } });   // 遊興：賽成功で掛け金返却＋追加
    state.flowed += state.field.filter(f=>f.result.winner===null && f.claimed==null).length;   // 王権が取った分は流れに数えない
    if(S.winLine>0 && (state.players[0].coins>=S.winLine || state.players[1].coins>=S.winLine)) state.forcedWin=true; // 強制勝利ライン：フェーズ終了時に到達チェック（チーム決定）
    state.phase='reveal'; render();
  }
  /* ----- 主人公パッシブ（コイン加算系・Slice A）。HT=ターン上限カウンタ／players[pi].heroCnt=試合上限カウンタ ----- */
  function heroNormal(pi,kind){ const h=state.players[pi].hero; return (h&&h.normal&&h.normal.kind===kind)?h.normal:null; }
  function heroCost(pi,r){ const n=heroNormal(pi,'relicCostDown'); const c=(r&&r.cost)||0; return n ? Math.max(n.min||1, c-(n.n||1)) : c; }   // 無欲：遺物コスト−1（最低1）
  function heroAcquire(pi,cust,HT,hg){ const n=heroNormal(pi,'gainOnAcquireRarity'); if(!n||cust.rarity!==n.rarity) return;   // 食欲：指定レア客の獲得で+1（ターン/試合上限）
    const t=HT[pi], g=state.players[pi].heroCnt; t.acqR=t.acqR||0; g.acqR=g.acqR||0;
    if(t.acqR<(n.perTurn||1) && g.acqR<(n.perGame||999)){ hg(pi,1); t.acqR++; g.acqR++; } }
  function heroDominate(pi,r,HT,hg){ const n=heroNormal(pi,'gainOnDominate'); if(!n) return;   // 闘争：条件差margin以上で競り勝つと+1（ターン上限）
    const m=(pi===0)?(r.n0-r.n1):(r.n1-r.n0); const t=HT[pi]; t.dom=t.dom||0;
    if(m>=(n.margin||2) && t.dom<(n.perTurn||2)){ hg(pi,1); t.dom++; } }
  function heroFlow(pi,flowN,HT,hg){ const n=heroNormal(pi,'gainOnFlow'); if(!n) return;   // 物欲：流れた客1人につき+1（ターン上限）
    const t=HT[pi]; t.flow=t.flow||0; const add=Math.min(flowN, n.perTurn||1)-t.flow; if(add>0){ hg(pi,add); t.flow+=add; } }
  /* ----- 主人公パッシブ（判定・盤面系・Slice B）----- */
  function heroHasKind(st,pi,kind){ const p=st&&st.players&&st.players[pi], h=p&&p.hero; return !!(h&&h.normal&&h.normal.kind===kind); }   // 不朽：st基準の判定（applyDeclaredRelic用）
  function heroFreedomBonus(p,idx,f){ const n=heroNormal(p,'wildMotifSlot'); if(!n||idx!==n.slot||!f.placed[p]) return 0;   // 自由：陳列②(slot)のピンは絵柄条件を満たす扱い＝未達の絵柄条件数を加算
    let add=0; (f.customer.conditions||[]).forEach(function(c){ if(c.axis==='motif' && !satisfies(f.placed[p],c)) add++; }); return add; }
  function heroSteal(q,cust,HT,hg){ const opp=1-q, n=heroNormal(opp,'stealOnOppHighVp'); if(!n) return;   // 性欲：相手(q)がUC/R獲得→1コインをoppへ（ターン/試合上限・相手0なら不可）
    if((cust.vp||0)<(n.minVp||2)) return; const t=HT[opp], g=state.players[opp].heroCnt; t.steal=t.steal||0; g.steal=g.steal||0;
    if(t.steal>=(n.perTurn||1) || g.steal>=(n.perGame||3) || state.players[q].coins<=0) return;
    state.players[q].coins-=1; state.lastGain[q]-=1; hg(opp,1); t.steal++; g.steal++; }
  function heroClaimFlows(won,hg){ const order=[state.firstThisTurn,1-state.firstThisTurn];   // 王権：流れ（同点・忘却以外）の最初(最小スロット)の1人を獲得・先行優先
    order.forEach(function(pi){ if(!heroNormal(pi,'claimFirstFlow')) return;
      for(let i=0;i<state.field.length;i++){ const f=state.field[i];
        if(!f.removed && f.result && f.result.winner===null && f.claimed==null){ f.claimed=pi; state.players[pi].acquired.push(f.customer); hg(pi,f.customer.vp); won[pi]++; break; } } }); }
  function nextTurn(){ for(let p=0;p<2;p++){ const used=new Set(state.field.map(f=>f.placed[p]).filter(Boolean).map(x=>x.iid)); state.players[p].supply=state.players[p].supply.filter(pin=>!used.has(pin.iid)); }
    if(state.forcedWin){ state.phase='gameover'; recordResult(); render(); return; } // 20到達＝そのフェーズ終了で即決着（未達なら従来どおり最終コイン最多）
    if(state.turn>=S.turns){ nextTurnStart(); return; }   // 最終ターン→集計へ（次ターンが無いので片付けは省略）
    beginCleanup(); }                                     // 片付け時（導きの羅針：次の自分の客を先読み）→ 次ターン開始
  /* ----- 片付け時：導きの羅針（次のターンに自分が出す客2枚を先読み・秘匿・コイン1）----- */
  function cleanCanPeek(pi){ const P=state.players[pi]; return (P.relicHand||[]).some(rid=>{ const r=relicDef(rid); return r && r.timing==='cleanup' && P.coins>=heroCost(pi,r); }); }
  function beginCleanup(){ state.cleanOrder=[state.firstThisTurn, 1-state.firstThisTurn]; state.cleanStep=0; state.peekShow=null; cleanAdvance(); }
  function cleanAdvance(){
    while(state.cleanStep<2){
      const pi=state.cleanOrder[state.cleanStep];
      if(!cleanCanPeek(pi)){ state.cleanStep++; continue; }                 // 使える羅針が無い／コイン不足→とばす
      if(state.mode==='ai' && pi===1){ state.cleanStep++; continue; }       // AIは使わない（情報の価値を貪欲評価しないため）
      state.peekShow=null;
      state.phase=(state.mode==='ai')?'cleanup':'cleanupHandoff'; render(); return; // 人間2人は受け渡し画面を挟む（秘匿）
    }
    state.cleanStep=0; nextTurnStart();                                     // 全員終わり→次ターン開始
  }
  function resetGame(){ if(confirm('最初からやり直しますか？ 現在の試合は破棄されます。')){ state=null; legendOpen=false; render(); } }

  /* 今ターンのどのフェーズか（仕込み0→公開直後1→調整2→判定直前3→判定4）。-1=ターン外（表示しない） */
  function phaseStep(){
    const p=state.phase;
    if(p==='stock'||p==='stockHandoff') return 0;
    if((p==='declare'||p==='declareHandoff') && state.declTiming==='postReveal') return 1;
    if(p==='adjust') return 2;
    if((p==='declare'||p==='declareHandoff') && state.declTiming==='declare') return 3;
    if(p==='reveal') return 4;
    return -1;
  }
  function phaseStepper(){
    const labels=['仕込み','公開直後','調整','判定直前','判定'], nums='①②③④⑤', cur=phaseStep();
    if(cur<0) return '';
    let chips='';
    for(let i=0;i<labels.length;i++){
      const cls = i<cur?'pstep done':(i===cur?'pstep cur':'pstep todo');
      const mark = i<cur ? '<span class="pchk">✓</span>' : nums[i];
      chips += (i>0?'<span class="psep">▸</span>':'') + '<span class="'+cls+'">'+mark+' '+labels[i]+'</span>';
    }
    return '<div class="pbar" data-tip="このターンの進み具合（今いるフェーズが光ります）">'+chips+'</div>';
  }

    return '<div class="topbar"><div class="sub">ターン '+state.turn+' / '+S.turns+' ・ '+label+' <span class="pill" data-tip="全ターン終了時にコインが多い方が勝ち。'+(S.winLine>0?'先に'+S.winLine+'コインへ到達すると、そのフェーズ終了時に即勝利。':'')+'">'+winTxt+'</span></div>'+howtoBtn()+legendBtn()+resultsBtn()+settingsBtn()+'</div>'+phaseStepper(); }

  const REDUCED_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function startCountUps(){
    document.querySelectorAll('.cnum[data-countup]').forEach(el=>{
      const to=+el.dataset.countup, from=+el.dataset.from;
      if(REDUCED_MOTION || !(to>from)){ el.textContent=to; return; }
      const t0=performance.now(), dur=700;
      function step(t){ const k=Math.min(1,(t-t0)/dur); el.textContent=Math.round(from+(to-from)*k); if(k<1 && document.body.contains(el)) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    });
  }

  function relicDef(id){ return (D.RELIC_POOL||[]).find(r=>r.id===id); }
  // 統一の手札（全プレイ画面の下部に常時表示）。activeTiming＝今使えるタイミング（'adjust'/'postReveal'/'declare'/null）。該当カードが発光。
  function relicHandStrip(pi, activeTiming){
    const hand=state.players[pi].relicHand||[], coins=state.players[pi].coins;
    const whenLabel=(t)=> t==='postReveal'?'公開直後':(t==='declare'?'判定直前':(t==='adjust'?'調整中':(t==='cleanup'?'片付け時':'')));
    const lab = activeTiming
      ? '◈ 遺物（手札）— '+esc(pname(pi))+'：今は <span class="coin">'+whenLabel(activeTiming)+'</span> の遺物が光ります'
      : '◈ 遺物（手札）— '+esc(pname(pi))+'（今は遺物を使えるタイミングではありません）';
    if(!hand.length) return '<div class="rhand"><div class="rh-label">'+lab+'</div><span class="note">手札なし（毎ターン1枚引く）</span></div>';
    const sel = state.declSel||{};
    const cards=hand.map(rid=>{ const r=relicDef(rid); if(!r) return '';
      const usableNow=(r.timing===activeTiming), ec=heroCost(pi,r), afford=coins>=ec, when=whenLabel(r.timing);
      let action;
      if(usableNow && activeTiming==='adjust'){
        action = afford
          ? '<button class="btn sm primary" onclick="EM.useRelic(\''+r.id+'\')" data-tip="'+esc(r.text)+'">使う（'+ec+' コイン）</button>'
          : '<button class="btn sm ghost" disabled data-tip="コインが足りません（必要 '+ec+' ／ 所持 '+coins+'）">使う（'+ec+' コイン）</button>';
      } else if(usableNow){                                   // 公開直後 / 判定直前：宣言で選ぶ
        const isSel=sel.relic===r.id;
        action = afford
          ? '<button class="btn sm '+(isSel?'primary':'')+'" onclick="EM.declareSelectRelic(\''+r.id+'\')" data-tip="'+esc(r.text)+'">'+(isSel?'✓ 選択中':'選ぶ ▶')+'</button>'
          : '<button class="btn sm ghost" disabled data-tip="コインが足りません（必要 '+ec+' ／ 所持 '+coins+'）">コイン不足</button>';
      } else {
        action = '<span class="note" style="display:inline-block;margin-top:6px">'+when+'に使用（今は待機）</span>';
      }
      const isSelHi = usableNow && activeTiming!=='adjust' && sel.relic===r.id;
      const cls='rcard'+(usableNow?(afford?' usable':' disabled'):' dim')+(isSelHi?' selA':'');
      return '<div class="'+cls+'" data-tip="'+esc(r.system+'｜'+r.text)+'">'
        +'<span class="rcost" data-tip="使用コスト（無欲は−1。払うと最終得点が減る）">'+ec+'</span>'
        +'<div class="rnm">◈ '+esc(r.name)+(usableNow?'<span class="rnow">▶ 今使える</span>':'')+'</div>'
        +'<div class="rsys">'+esc(r.system)+' ・'+when+(r.consumesTurn?'(手番消費)':'')+'</div>'
        +'<div class="rtx">'+esc(r.text)+'</div>'+action+'</div>'; }).join('');
    return '<div class="rhand"><div class="rh-label">'+lab+'</div><div class="rrow">'+cards+'</div></div>';
  }

      +'<div class="note" style="margin-bottom:22px">相手は画面を見ないでください。<br>'+tlabel+'に使う遺物を<b>1つだけ</b>伏せて宣言します（使わなくてもOK）。</div>'
      +'<button class="btn primary big" onclick="EM.beginDeclareTurn()">宣言をはじめる ▶</button></div>';
  }
  function declareScreen(){
    const pi=state.declOrder[state.declStep], P=state.players[pi], coins=P.coins;
    const tlabel = state.declTiming==='postReveal' ? '公開直後' : '判定直前';
    const sel=state.declSel||{relic:null,slot:null,slot2:null};
    const selR=sel.relic?relicDef(sel.relic):null;
    const tgt = selR ? selR.target : null;
    const need=(tgt==='cust2')?2:(tgt==='allSelf')?0:1;   // 必要な対象数（前方で定義＝対象待ちハイライトに使う）
    const pinRowTarget = (tgt==='selfSlot')?pi : (tgt==='oppSlot')?(1-pi) : null;   // ピンを選ぶ系（盃/呪印）
    const custTarget = (tgt==='cust2' || tgt==='custSlot');                         // 客を選ぶ系（香/忘却）
    const chosen = sel.slot==null ? [] : (sel.slot2==null ? [sel.slot] : [sel.slot, sel.slot2]);
    const head=topbar(tlabel+' — '+esc(pname(pi))+' の伏せ宣言');
    let rowO='', rowC='', rowM='';
    const slotPin=(rp,i)=>{ const f=state.field[i], c=f.customer, pin=f.placed[rp];
      const can=(pinRowTarget===rp), isCh=(can && sel.slot===i);
      const allSelfHit=(selR&&selR.effect==='plusJudgeAllSelf'&&rp===pi);   // 黄金の酒宴：自分の全ピンに+1プレビュー
      let delta='';
      if(allSelfHit) delta='+1';
      else if(selR&&isCh){
        if(selR.effect==='plusJudgeSelf') delta='+1';
        else if(selR.effect==='minusJudgeOpp') delta='−1';
        else if(selR.effect==='maskMotifSelf'){ let add=0; c.conditions.forEach(function(cd){ if(cd.axis==='motif'&&!satisfies(pin,cd)) add++; }); delta=add>0?('絵柄+'+add):'絵柄±0'; }   // 偽相の仮面：満たせる絵柄条件の数
      }
      const nn=countSatisfied(pin,c);
      const cls='ppin '+(rp===0?'me':'opp')+(can?(isCh?' selA':((selR&&chosen.length<need)?' await':' click')):'');   // 対象待ち＝点滅で誘導
      const oc=can?(' onclick="EM.declareSelectSlot('+i+')"'):'';
      return '<div class="'+cls+'"'+oc+' data-tip="'+esc(pin?('商品：'+pin.name):'空き')+'"><div class="side">'+esc(pname(rp))+(rp===pi?'（あなた）':'')+'</div>'
        +'<span class="cnt">'+nn+' / '+c.conditions.length+(delta?' <b class="coin">'+delta+'</b>':'')+'</span>'
        +'<span class="ttl">'+(pin?'◇ '+esc(pin.name):'—')+'</span>'+(pin?'<div class="tokwrap">'+pinTokenHTML(pin,46)+'</div>':'')+'</div>';
    };
    state.field.forEach((f,i)=>{ const c=f.customer;
      const cCh = custTarget && chosen.indexOf(i)>=0;
      const custMk = (tgt==='cust2') ? (chosen.length===2?('↔ 客'+(chosen[0]+1)+'↔客'+(chosen[1]+1)):'↔ もう1人を選ぶ') : (selR&&selR.effect==='lockCustomer'?'🛡 保護':'✕ 消滅');
      const cMark = cCh ? ('<div class="center coin" style="font-size:11px;margin-top:2px">'+custMk+'</div>') : '';
      const cClick = custTarget ? (cCh?' selA':((selR&&chosen.length<need)?' await':' click')) : '';   // 対象待ち＝点滅で誘導
      const cOc = custTarget ? (' onclick="EM.declareSelectSlot('+i+')"') : '';
      rowO+='<div class="lane" style="grid-column:'+(i+1)+';grid-row:1">'+slotPin(1,i)+'</div>';
      rowC+='<div class="pcard r'+(i%4)+' '+c.rarity+cClick+'" style="grid-column:'+(i+1)+';grid-row:2"'+cOc+'><div class="no">客'+(i+1)+'</div>'+custMid(c)+cMark+'</div>';
      rowM+='<div class="lane" style="grid-column:'+(i+1)+';grid-row:3">'+slotPin(0,i)+'</div>';
    });
    const market='<div class="tgrid"><div class="clothband" style="grid-row:2"></div>'+rowO+rowC+rowM+'</div>';
    const opp=zoneBar(1,false,'<span class="note">'+(pi===1?'あなた':'相手')+'</span>');
    const me=zoneBar(0,false,'<span class="note">'+(pi===0?'あなた':'相手')+'</span>');
    const board='<div class="table"><div class="board">'+opp+market+me+'</div></div>';
    // 使える遺物が無い／コイン不足／1ターン1枚で使用済み → 「次へ」だけの窓（PD-02：常に表示モードで出る）
    if(!canDeclare(pi, state.declTiming)){
      const hasTimingRelic=(P.relicHand||[]).some(rid=>{ const r=relicDef(rid); return r&&r.timing===state.declTiming; });
      let reason;
      if(S.relicLimit==='perTurn' && state.declaredThisTurn && state.declaredThisTurn[pi]) reason='「1ターン1枚」設定で、すでに今ターンに遺物を使いました。';
      else if(!hasTimingRelic) reason='この'+tlabel+'で使える遺物が手札にありません。';
      else reason='コインが足りず、'+tlabel+'の遺物を使えません。';
      return head+board+relicHandStrip(pi, state.declTiming)
        +'<div class="topbar" style="margin-top:10px"><div class="note"><b>'+esc(pname(pi))+'</b>：'+esc(reason)+'</div><div><button class="btn primary" onclick="EM.declarePass()">次へ ▶</button></div></div>';
    }
    const hand=relicHandStrip(pi, state.declTiming);   // 全手札を表示し、この窓のタイミングの遺物を発光・「選ぶ」
    let step;
    if(!selR) step='① 遺物を1つ選ぶ（使わないなら「使わない」）。';
    else if(tgt==='allSelf')  step='② 自分の全ピンが +1（対象選択は不要）→「これで伏せる」。';
    else if(tgt==='cust2')    step=(sel.slot==null?'② 入れ替える客を1人タップ。':(sel.slot2==null?'③ もう1人の客をタップ。':'④「これで伏せる」。'));
    else if(tgt==='custSlot') step=(sel.slot==null?('② '+(selR.effect==='lockCustomer'?'守る':'取り除く')+'客をタップ。'):'③「これで伏せる」。');
    else step=(sel.slot==null?('② 対象の '+(tgt==='selfSlot'?'自分（下段）':'相手（上段）')+' のピンをタップ。'):'③「これで伏せる」。');
    const guide='<div class="note" style="margin:6px 0"><b>'+esc(pname(pi))+'</b>：'+tlabel+'に使う遺物を<b>1つだけ</b>伏せて宣言（相手には見えません・解決は先行側から）。'+esc(step)+'</div>';
    const canConfirm = selR && chosen.length===need && coins>=heroCost(pi,selR);
    const remain=need-chosen.length;
    const bar='<div class="topbar" style="margin-top:10px"><div class="note">伏せたら相手の番（または次へ）へ進みます</div><div style="display:flex;gap:8px">'
      +(selR?'<button class="btn ghost" onclick="EM.declareCancel()">選択解除</button>':'')
      +'<button class="btn" onclick="EM.declarePass()" data-tip="この窓では遺物を使わない">使わない（パス）</button>'
      +'<button class="btn primary" onclick="EM.declareConfirm()" '+(canConfirm?'':'disabled')+'>'+(canConfirm?'▶ これで伏せる':(!selR?'① 遺物を選ぶ':(need===0?'▶ これで伏せる':'② 対象をタップ（あと'+remain+'）')))+'</button></div></div>';
    return head+board+hand+guide+bar;
  }
  function adjustScreen(){
    const act=state.adjustActive;
    const head=topbar('配置調整（公開）');
    const opp=zoneBar(1, act===1, chipsHTML(1));
    const selSlot=state.adjSel; const selPin=(selSlot!=null)?state.field[selSlot].placed[act]:null;
    let bestPrev=-1; if(selPin){ state.field.forEach(f=>{ const v=countSatisfied(selPin,f.customer); if(v>bestPrev) bestPrev=v; }); }
    let rowO='', rowC='', rowM='';
    state.field.forEach((f,i)=>{
      const c=f.customer; const total=c.conditions.length; const pre=judgeCustomer(f.placed[0],f.placed[1],c,S); const lead=f.removed?[false,false]:[pre.winner===0,pre.winner===1];
      const reqs='<div class="creq">'+c.conditions.map(cd=>condChip(cd,[f.placed[0],f.placed[1]],act)).join('')+'</div>';
      const stat = f.removed ? '<div class="center coin" style="font-size:12px">✕ 忘却で消滅（流れ）</div>'
        : (pre.winner===0||pre.winner===1)?('<div class="center" style="font-size:12px"><span class="coin">'+esc(pname(pre.winner))+' 優勢</span></div>'):'<div class="center note">互角＝流れ</div>';
      let prev='';
      if(selPin && !f.removed){ const v=countSatisfied(selPin,c); const isSel=(i===selSlot); prev='<div class="prev'+(isSel?' cur':((v===bestPrev&&v>0)?' best':''))+'">'+(isSel?'⇄ 選択中（'+v+'/'+total+'）':'ここへ移すと '+v+'/'+total)+'</div>'; }
      rowO+='<div class="lane" style="grid-column:'+(i+1)+';grid-row:1">'+ppinBox(f.placed[1],1,i,lead[1],pre.n1)+'</div>';
      rowC+='<div class="pcard r'+(i%4)+' '+c.rarity+'" style="grid-column:'+(i+1)+';grid-row:2'+(f.removed?';opacity:.55':'')+'"><div class="no">客'+(i+1)+'</div>'+custMid(c)+reqs+stat+prev+'</div>';
      rowM+='<div class="lane" style="grid-column:'+(i+1)+';grid-row:3">'+ppinBox(f.placed[0],0,i,lead[0],pre.n0)+'</div>';
    });
    const market='<div class="tgrid"><div class="clothband" style="grid-row:2"></div>'+rowO+rowC+rowM+'</div>';
    const me=zoneBar(0, act===0, chipsHTML(0));
    const guide='<div class="note" style="margin:6px 0">条件の <span class="chk y">✓</span>＝あなたの商品が合致／<span class="chk n">✗</span>＝不一致。商品トークンは形・大きさ・透け・紋様・刻印で8軸を表す（📖凡例）。マウスを乗せると詳細。'
      +(state.changesLeft[act]>0?('<br><span class="coin">'+esc(pname(act))+'：自分の商品（'+(act===0?'下段':'上段')+'）を2枚選ぶと位置を入れ替え（残り'+state.changesLeft[act]+'回）。'+(state.adjSel!=null?'各客の「ここへ移すと x/y」を見て移動先を選ぶ。':'1枚目を選ぶと、各客への適性（x/y）が表示されます。')+'</span>'):'<span class="coin">'+esc(pname(act))+'：変更を使い切りました。パスしてください。</span>')+'</div>';
    const bar='<div class="topbar" style="margin-top:10px"><div class="note">両者が連続でパスすると判定に進みます</div><div style="display:flex;gap:8px">'
      +'<button class="btn ghost" onclick="EM.undoAdj()" '+(canUndoAdj()?'':'disabled')+' data-tip="'+(state.mode==='ai'?'自分の直前の手（とAIの応手）を取り消して打ち直す':'直前の入れ替え／パスを取り消す（いわゆる『待った』。相手と合意の上で）')+'">↩ 1手戻す</button>'
      +(state.adjSel!=null?'<button class="btn ghost" onclick="EM.cancelSel()">選択解除</button>':'')
      +'<button class="btn ghost" onclick="EM.resetGame()">リセット</button>'
      +'<button class="btn primary" onclick="EM.adjPass()">パス（相手の番へ） ▶</button></div></div>';
    return head+'<div class="table"><div class="board">'+opp+market+me+'</div></div>'+postRevealNote()+betActiveNote()+relicHandStrip(act,'adjust')+guide+bar;
  }

  function revealScreen(){

      return '<div class="center" style="font-size:11px;margin-top:3px">'+ds.map(d=>'<span class="coin">◈'+esc(d.name)+'</span> <span class="note">'+esc(pname(d.pi))+(d.effect==='plusJudgeSelf'?' +1':d.effect==='minusJudgeOpp'?' −1':'（絵柄）')+'</span>').join('　')+'</div>'; };
    state.field.forEach((f,i)=>{

    const btn='<div class="center" style="margin-top:14px"><button class="btn primary big" onclick="EM.nextTurn()">'+(last?'最終結果へ ▶':'次のターンへ ▶')+'</button> <button class="btn ghost" onclick="EM.resetGame()">リセット</button></div>';
    return head+'<div class="table"><div class="board">'+opp+market+me+'</div></div>'+postRevealNote()+judgeWideNote()+betNote()+fwLine+btn;
  }

  /* ---------- セルフテスト ---------- */
  function runTests(){
    const t=[]; const pinA={size_mm:30,transparency:'transparent',hasText:true,count:'multiple',living:true,motif:'animal',shape:'angular',symmetry:true};
    const pinB={size_mm:14,transparency:'opaque',hasText:false,count:'single',living:false,motif:'food',shape:'circle',symmetry:false};
    const cX={vp:1,conditions:[{axis:'size_mm',op:'>=',value:25},{axis:'motif',op:'==',value:'animal'},{axis:'living',op:'==',value:false}]};
    const add=(name,cond)=>t.push({name,pass:!!cond});
    add('satisfies >= 真', satisfies(pinA,{axis:'size_mm',op:'>=',value:25})===true);
    add('satisfies >= 偽', satisfies(pinB,{axis:'size_mm',op:'>=',value:25})===false);
    add('satisfies <= 真', satisfies(pinB,{axis:'size_mm',op:'<=',value:20})===true);
    add('satisfies == 列挙 真', satisfies(pinA,{axis:'motif',op:'==',value:'animal'})===true);
    add('satisfies != 真', satisfies(pinA,{axis:'transparency',op:'!=',value:'opaque'})===true);
    add('satisfies == 真偽 真', satisfies(pinA,{axis:'living',op:'==',value:true})===true);
    add('countSatisfied=2', countSatisfied(pinA,cX)===2);
    add('countSatisfied(null)=0', countSatisfied(null,cX)===0);
    add('judge 勝者0', judgeCustomer(pinA,pinB,cX,{tiebreak:'none'}).winner===0);
    add('judge 勝者1', judgeCustomer(pinB,pinA,cX,{tiebreak:'none'}).winner===1);
    const tie={vp:2,conditions:[{axis:'motif',op:'==',value:'object'}]};
    add('judge 同点 none→null', judgeCustomer(pinA,pinB,tie,{tiebreak:'none'}).winner===null);
    add('judge 同点 both', judgeCustomer(pinA,pinB,tie,{tiebreak:'both'}).winner==='both');
    add('judge 同点 split', judgeCustomer(pinA,pinB,tie,{tiebreak:'split'}).winner==='split');
    add('judge 両者空＝流れ（split/bothでも）', judgeCustomer(null,null,tie,{tiebreak:'split'}).winner===null && judgeCustomer(null,null,tie,{tiebreak:'both'}).winner===null);
    add('得点：勝者にvp加算', (function(){ let coins=0; const r=judgeCustomer(pinA,pinB,cX,{tiebreak:'none'}); if(r.winner===0) coins+=cX.vp; return coins===1; })());
    add('入れ替えで勝敗が変わる', (function(){ const cA={vp:1,conditions:[{axis:'motif',op:'==',value:'animal'}]}; return countSatisfied(pinB,cA)===0 && countSatisfied(pinA,cA)===1; })());
    add('全アイコン定義あり', MOTIFS.every(m=>ICON.motif[m]) && TRANSP.every(x=>ICON.transparency[x]) && SHAPES.every(x=>ICON.shape[x]));
    add('matchInfo 合致/不一致を判定', (function(){ const mi=matchInfo(pinA,{conditions:cX.conditions}); return mi.green.has('motif') && mi.green.has('size_mm') && mi.red.has('living'); })());
    add('遺物 砂の還流：自分の入替 +1', (function(){ const st={changesLeft:[2,2]}; applyRelic(st,0,{effect:'plusSwapSelf'}); return st.changesLeft[0]===3 && st.changesLeft[1]===2; })());
    add('遺物 沈黙の錘：相手の入替 -1（0未満にならない）', (function(){ const st={changesLeft:[2,1]}; applyRelic(st,0,{effect:'minusSwapOpp'}); applyRelic(st,0,{effect:'minusSwapOpp'}); return st.changesLeft[1]===0; })());
    add('遺物データ：cost/effect 定義あり', (D.RELIC_POOL||[]).length>0 && D.RELIC_POOL.every(r=>typeof r.cost==='number' && !!r.effect));
    // --- 判定直前の遺物（盃/呪印）：judgeCustomer の条件数補正 ---
    const pinC={size_mm:20,transparency:'opaque',hasText:false,count:'single',living:false,motif:'animal',shape:'circle',symmetry:true};
    const tieJ={vp:2,conditions:[{axis:'motif',op:'==',value:'object'}]};            // pinA・pinB とも不一致＝同点
    const cReq2={vp:1,conditions:[{axis:'motif',op:'==',value:'animal'},{axis:'living',op:'==',value:true}]}; // pinA=2満たす/pinC=1満たす
    add('遺物 満ちる盃：同点→自分(+1)が勝ち', judgeCustomer(pinA,pinB,tieJ,{tiebreak:'split'},1,0).winner===0);
    add('遺物 凋落の呪印：同点→相手(-1)で自分が勝ち', judgeCustomer(pinA,pinB,tieJ,{tiebreak:'split'},0,-1).winner===0);
    add('遺物 盃：1差負け→盃(+1)で同点(split)に戻す', judgeCustomer(pinC,pinA,cReq2,{tiebreak:'split'},1,0).winner==='split' && judgeCustomer(pinC,pinA,cReq2,{tiebreak:'split'}).winner===1);
    add('遺物 判定補正：補正0なら従来と同一', judgeCustomer(pinA,pinB,cX,{tiebreak:'none'},0,0).winner===judgeCustomer(pinA,pinB,cX,{tiebreak:'none'}).winner);
    add('遺物 判定補正：両者空は補正でも流れ', judgeCustomer(null,null,cX,{tiebreak:'split'},1,0).winner===null);
    add('遺物データ：満ちる盃/凋落の呪印が定義済み(コスト2・declare)', (function(){ const s=(D.RELIC_POOL||[]).find(r=>r.id==='rel_sakazuki'), j=(D.RELIC_POOL||[]).find(r=>r.id==='rel_juin'); return !!s&&!!j&&s.cost===2&&j.cost===2&&s.timing==='declare'&&j.timing==='declare'&&s.effect==='plusJudgeSelf'&&j.effect==='minusJudgeOpp'&&s.target==='selfSlot'&&j.target==='oppSlot'; })());
    add('遺物 宣言の対象：盃=自分側+1／呪印=相手側-1', (function(){ const a=relicJudgeDelta('plusJudgeSelf',0), b=relicJudgeDelta('plusJudgeSelf',1), c=relicJudgeDelta('minusJudgeOpp',0), d=relicJudgeDelta('minusJudgeOpp',1); return a.p===0&&a.d===1 && b.p===1&&b.d===1 && c.p===1&&c.d===-1 && d.p===0&&d.d===-1; })());
    // --- 公開直後の遺物（誘いの香）：客の入れ替え ---
    add('遺物 誘いの香：客2人の位置を入れ替える', (function(){ var st={field:[{customer:{id:'A'}},{customer:{id:'B'}},{customer:{id:'C'}}]}; applyDeclaredRelic(st,0,{slot:0,slot2:2},{effect:'swapCustomers'}); return st.field[0].customer.id==='C' && st.field[2].customer.id==='A' && st.field[1].customer.id==='B'; })());
    add('遺物 効果適用：盃の補正が judgeDelta に乗る', (function(){ var st={judgeDelta:[[0,0],[0,0]]}; applyDeclaredRelic(st,0,{slot:1},{effect:'plusJudgeSelf'}); return st.judgeDelta[1][0]===1 && st.judgeDelta[1][1]===0; })());
    add('遺物データ：誘いの香が定義済み(コスト1・postReveal・cust2)', (function(){ var k=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_kaori';}); return !!k && k.cost===1 && k.timing==='postReveal' && k.target==='cust2' && k.effect==='swapCustomers'; })());
    add('遺物 忘却の髑髏：客を除外（removed=true）', (function(){ var st={field:[{customer:{id:'A'}},{customer:{id:'B'}}]}; applyDeclaredRelic(st,0,{slot:1},{effect:'removeCustomer'}); return st.field[1].removed===true && !st.field[0].removed; })());
    add('遺物データ：忘却の髑髏が定義済み(コスト2・postReveal・custSlot・removeCustomer)', (function(){ var k=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_dokuro';}); return !!k && k.cost===2 && k.timing==='postReveal' && k.target==='custSlot' && k.effect==='removeCustomer'; })());
    add('遺物 黄金の酒宴：自分の全ピンに判定+1', (function(){ var st={judgeDelta:[[0,0],[0,0],[0,0]]}; applyDeclaredRelic(st,0,{},{effect:'plusJudgeAllSelf'}); return st.judgeDelta[0][0]===1 && st.judgeDelta[1][0]===1 && st.judgeDelta[2][0]===1 && st.judgeDelta[0][1]===0; })());
    add('遺物データ：黄金の酒宴が定義済み(コスト4・declare・allSelf・plusJudgeAllSelf)', (function(){ var k=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_utage';}); return !!k && k.cost===4 && k.timing==='declare' && k.target==='allSelf' && k.effect==='plusJudgeAllSelf'; })());
    add('遺物 不動の楔：保護客は除外も入替もされない', (function(){ var st={field:[{customer:{id:'A'}},{customer:{id:'B'}}]}; applyDeclaredRelic(st,0,{slot:0},{effect:'lockCustomer'}); applyDeclaredRelic(st,1,{slot:0},{effect:'removeCustomer'}); applyDeclaredRelic(st,1,{slot:0,slot2:1},{effect:'swapCustomers'}); return st.field[0].locked===true && !st.field[0].removed && st.field[0].customer.id==='A' && st.field[1].customer.id==='B'; })());
    add('遺物 偽相の仮面：満たせる絵柄条件の数だけ判定+1', (function(){ var pinO={size_mm:20,transparency:'opaque',hasText:false,count:'single',living:false,motif:'object',shape:'circle',symmetry:true}; var cust={conditions:[{axis:'motif',op:'==',value:'animal'},{axis:'size_mm',op:'>=',value:10}]}; var st={judgeDelta:[[0,0]], field:[{customer:cust, placed:[pinO,null]}]}; applyDeclaredRelic(st,0,{slot:0},{effect:'maskMotifSelf'}); return st.judgeDelta[0][0]===1; })());
    add('遺物データ：不動の楔/偽相の仮面が定義済み', (function(){ var ku=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_kusabi';}), me=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_men';}); return !!ku&&!!me && ku.cost===1&&ku.timing==='postReveal'&&ku.target==='custSlot'&&ku.effect==='lockCustomer' && me.cost===2&&me.timing==='declare'&&me.target==='selfSlot'&&me.effect==='maskMotifSelf'; })());
    // --- 調整中の遺物（運命の賽）：賭けの宣言と精算 ---
    add('遺物 運命の賽：賭けフラグが立つ', (function(){ var st={bet:[false,false]}; applyRelic(st,0,{effect:'betWin'}); return st.bet[0]===true && st.bet[1]===false; })());
    add('遺物 運命の賽：精算は2人以上で+3／1人以下0', betPayoff(0)===0 && betPayoff(1)===0 && betPayoff(2)===3 && betPayoff(3)===3);
    add('遺物データ：運命の賽が定義済み(コスト1・adjust・betWin)', (function(){ var k=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_sai';}); return !!k && k.cost===1 && k.timing==='adjust' && k.effect==='betWin' && k.consumesTurn===false; })());
    // --- 片付け時の遺物（導きの羅針）と正本プリセット ---
    add('遺物データ：導きの羅針が定義済み(コスト1・cleanup・peekNext)', (function(){ var k=(D.RELIC_POOL||[]).find(function(r){return r.id==='rel_rashin';}); return !!k && k.cost===1 && k.timing==='cleanup' && k.effect==='peekNext'; })());
    add('遺物データ：正本プリセットは10種各1（賽・羅針を含み酒宴を除く）', (function(){ var p=D.PRESET_RELICS||[]; if(p.length!==10) return false; var u={}; p.forEach(function(id){u[id]=(u[id]||0)+1;}); var ids=Object.keys(u); return ids.length===10 && ids.every(function(id){return u[id]===1;}) && u['rel_sai']===1 && u['rel_rashin']===1 && !u['rel_utage']; })());
    // --- 主人公（Phase3・パッシブ）---
    add('主人公データ：12人・schema(id/desire/name/normal.kind/text)', (function(){ var H=D.HERO_POOL||[]; return H.length===12 && H.every(function(h){ return h.id&&h.desire&&h.name&&h.normal&&h.normal.kind&&h.normal.text; }); })());
    add('主人公データ：金銭+2/食欲C上限/物欲流れ/闘争差2 が定義済み', (function(){ var f=function(id){return (D.HERO_POOL||[]).find(function(h){return h.id===id;});}; var k=f('hero_kinsen'),s=f('hero_shokuyoku'),b=f('hero_butsuyoku'),t=f('hero_toso'); return !!k&&!!s&&!!b&&!!t && k.normal.kind==='startCoins'&&k.normal.n===2 && s.normal.kind==='gainOnAcquireRarity'&&s.normal.rarity==='C'&&s.normal.perTurn===1&&s.normal.perGame===4 && b.normal.kind==='gainOnFlow'&&b.normal.perTurn===1 && t.normal.kind==='gainOnDominate'&&t.normal.margin===2&&t.normal.perTurn===2; })());
    add('主人公データ：不朽/自由(陳列②)/王権/性欲のkind', (function(){ var f=function(id){return (D.HERO_POOL||[]).find(function(h){return h.id===id;});}; return f('hero_fukyu').normal.kind==='immuneToMinus' && f('hero_jiyu').normal.kind==='wildMotifSlot' && f('hero_jiyu').normal.slot===1 && f('hero_ouken').normal.kind==='claimFirstFlow' && f('hero_seiyoku').normal.kind==='stealOnOppHighVp' && f('hero_seiyoku').normal.perGame===3; })());
    add('主人公 不朽：呪印の−1が不朽のピンに効かない（通常ピンには効く）', (function(){ var im={judgeDelta:[[0,0]], players:[{},{hero:{normal:{kind:'immuneToMinus'}}}]}; applyDeclaredRelic(im,0,{slot:0},{effect:'minusJudgeOpp'}); var no={judgeDelta:[[0,0]], players:[{},{}]}; applyDeclaredRelic(no,0,{slot:0},{effect:'minusJudgeOpp'}); return im.judgeDelta[0][1]===0 && no.judgeDelta[0][1]===-1; })());
    add('主人公データ：無欲/知識/睡眠/遊興のkind', (function(){ var f=function(id){return (D.HERO_POOL||[]).find(function(h){return h.id===id;});}; return f('hero_muyoku').normal.kind==='relicCostDown'&&f('hero_muyoku').normal.min===1 && f('hero_chishiki').normal.kind==='peekOwnThisTurn' && f('hero_suimin').normal.kind==='chooseSecond' && f('hero_yukyo').normal.kind==='betRefundPlus'; })());
    add('主人公データ：全12人のkindがHERO_POOLに揃う', (D.HERO_POOL||[]).length===12);
    const errs=validateData(D);
    add('validateData：仮データにエラー0件'+(errs.length?'（'+errs.length+'件）':''), errs.length===0);
    return {t,errs};
  }
  function testScreen(){
    const {t,errs}=runTests(); const passed=t.filter(x=>x.pass).length;
    let html='<div class="topbar"><div><div class="sub">EVER MARKET — SELF TEST</div><div class="big">セルフテスト</div></div><div class="big '+(passed===t.length?'ok':'ng')+'">'+passed+' / '+t.length+' 通過</div></div>';
    html+='<div class="panel">'+t.map(x=>'<div class="testrow"><span class="'+(x.pass?'ok':'ng')+'">'+(x.pass?'✓':'✗')+'</span> '+esc(x.name)+'</div>').join('')+'</div>';
    if(errs.length) html+='<div class="panel" style="margin-top:12px"><div class="ng">データ検証エラー：</div>'+errs.map(e=>'<div class="testrow ng">'+esc(e)+'</div>').join('')+'</div>';
    html+='<div class="center" style="margin-top:18px"><a class="btn" href="./index.html">▶ ゲームへ戻る</a></div>';
    return html;
  }

  /* ---------- 公開API ---------- */
  window.EM={ startMatch:(mode)=>{newGame(mode||'hotseat');}, again:()=>{newGame(lastMode);},
    pickHero:(id)=>{ const pi=state.heroPick; if(pi==null) return; state.players[pi].hero=(D.HERO_POOL||[]).find(h=>h.id===id)||null; const nx=nextHeroPicker(pi+1); if(nx==null){ finalizeHeroes(); } else { state.heroPick=nx; render(); } },
    beginStock, selectStockPin, stockPlaceAt, stockRemoveAt, stockReset, stockConfirm,
    selectAdjSlot, adjPass, undoAdj, useRelic, cancelSel:()=>{state.adjSel=null;render();}, nextTurn, resetGame, toTitle:()=>{state=null;legendOpen=false;render();},
    beginDeclareTurn:()=>{ state.phase='declare'; state.declSel=null; render(); },
    declareSelectRelic:(rid)=>{ const cur=state.declSel&&state.declSel.relic===rid; state.declSel = cur?null:{relic:rid,slot:null,slot2:null}; render(); },
    declareSelectSlot:(i)=>{ const s=state.declSel; if(!s||!s.relic) return; const r=relicDef(s.relic);
      if(r&&r.target==='cust2'){                                  // 客2人（入れ替え）：2枚まで選ぶ
        if(s.slot===i){ s.slot=s.slot2; s.slot2=null; }           // 1人目を外す（2人目を繰上げ）
        else if(s.slot2===i){ s.slot2=null; }                     // 2人目を外す
        else if(s.slot==null){ s.slot=i; }
        else if(s.slot2==null){ s.slot2=i; }                      // 2人目を選ぶ（3枚目以降は無視）
      } else { s.slot=(s.slot===i)?null:i; }                      // 単一選択（盃/呪印/忘却）：トグル
      render(); },
    declareCancel:()=>{ state.declSel=null; render(); },
    declarePass:()=>{ const pi=state.declOrder[state.declStep]; state.declarations[pi]=null; state.declStep++; state.declSel=null; declAdvance(); },
    declareConfirm:()=>{ const pi=state.declOrder[state.declStep], s=state.declSel; if(!s||!s.relic) return; const r=relicDef(s.relic); if(!r||state.players[pi].coins<heroCost(pi,r)) return;
      const need=(r.target==='cust2')?2:(r.target==='allSelf')?0:1, have=(s.slot==null)?0:((s.slot2==null)?1:2); if(have!==need) return;
      state.declarations[pi]={relic:s.relic, slot:s.slot, slot2:s.slot2}; state.declStep++; state.declSel=null; declAdvance(); },
    beginCleanTurn:()=>{ state.phase='cleanup'; render(); },
    cleanPeek:()=>{ const pi=state.cleanOrder[state.cleanStep], P=state.players[pi];
      const rid=(P.relicHand||[]).find(id=>{ const r=relicDef(id); return r && r.timing==='cleanup' && P.coins>=heroCost(pi,r); }); if(!rid) return;
      const r=relicDef(rid); P.coins-=heroCost(pi,r); const k=P.relicHand.indexOf(rid); if(k>=0) P.relicHand.splice(k,1);   // 支払い（無欲はコスト−1）＝最終得点が減る
      state.peekShow=(P.customerDeck||[]).slice(0,CFG.customersPresentedPerPlayer); render(); },             // 次ターンに自分が出す客＝customerDeck の先頭2枚
    cleanSkip:()=>{ state.cleanStep++; state.peekShow=null; cleanAdvance(); },
    cleanAck:()=>{ state.peekShow=null; state.cleanStep++; cleanAdvance(); },
    toggleLegend:()=>{legendOpen=!legendOpen;render();},
    toggleResults:()=>{resultsOpen=!resultsOpen;render();},
    exportResults:()=>{ const t=resultsTSV(); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>alert('記録をコピーしました（表計算ソフトに貼り付けできます）'),()=>window.prompt('コピーしてください',t)); } else window.prompt('コピーしてください',t); },
    clearResults:()=>{ if(confirm('記録をすべて消しますか？')){ localStorage.removeItem(RKEY); render(); } },
    toggleSettings:()=>{settingsOpen=!settingsOpen;render();},
    setSetting:(k,v)=>{ if(k==='turns') v=Math.min(v, Math.floor(CFG.pinsPerPlayer/CFG.pinsPerTurn)); S[k]=v; saveSettings(S); render(); },
    resetSettings:()=>{ S=defaultSettings(); saveSettings(S); render(); },
    applyFairPreset:()=>{ S=Object.assign(defaultSettings(),{deckMode:'mirror',firstMover:'trailing',tiebreak:'split'}); saveSettings(S); render(); },
    newWithSettings:()=>{ settingsOpen=false; newGame(lastMode); },
    openHowto:()=>{ howtoOpen=true; render(); },
    closeHowto:()=>{ howtoOpen=false; try{localStorage.setItem('em_seen_howto','1');}catch(e){} render(); } };
  // テスト用：本物のエンジンを外部から使えるように公開（ゲーム挙動には影響しない）
  window.EM_DEBUG={ satisfies, countSatisfied, judgeCustomer, applyRelic, relicJudgeDelta, betPayoff, getState:()=>state, matchInfo, instPins, instCustomers, shuffle, mulberry32, CFG, DATA:D };

  /* ---------- ツールチップ（マウスオーバー詳細） ---------- */
  const tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl);
  document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(el){ tipEl.textContent=el.getAttribute('data-tip'); tipEl.style.display='block'; } });
  document.addEventListener('mousemove', e=>{ if(tipEl.style.display==='block'){ let x=e.clientX+14, y=e.clientY+16; if(x>window.innerWidth-260) x=window.innerWidth-260; tipEl.style.left=x+'px'; tipEl.style.top=y+'px'; } });
  document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')) tipEl.style.display='none'; });
  /* タッチ端末：タップで詳細を表示（3秒で消える）。ボタン等の操作がある要素は操作を優先しツールチップは出さない */
  let tipTimer=null;
  document.addEventListener('touchstart', e=>{
    const el=e.target.closest('[data-tip]');
    if(el && !el.closest('[onclick]')){
      tipEl.textContent=el.getAttribute('data-tip'); tipEl.style.display='block';
      const t=e.touches[0]; let x=t.clientX+14, y=t.clientY+16;
      if(x>window.innerWidth-260) x=window.innerWidth-260;
      if(y>window.innerHeight-80) y=Math.max(0,t.clientY-70);
      tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
      clearTimeout(tipTimer); tipTimer=setTimeout(()=>{ tipEl.style.display='none'; },3000);
    } else { tipEl.style.display='none'; }
  }, {passive:true});

  /* ---------- 起動 ---------- */
  if(location.search.indexOf('test')>=0){ app().innerHTML=testScreen(); }
  else { const errs=validateData(D);
    if(errs.length){ app().innerHTML='<div class="panel"><div class="ng big">データにエラーがあります（'+errs.length+'件）</div><div class="note">data.js を修正してください：</div>'+errs.map(e=>'<div class="testrow ng">'+esc(e)+'</div>').join('')+'</div>'; }
    else { try{ if(!localStorage.getItem('em_seen_howto')) howtoOpen=true; }catch(e){} render(); }   // 初回のみ遊び方を自動表示
  }
})();
